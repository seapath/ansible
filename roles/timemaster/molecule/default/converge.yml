---
- name: Converge
  hosts: all
  gather_facts: false
  become: true
  vars_files:
    - ../../defaults/main.yml
    - ../../vars/Debian.yml
  tasks:
    - name: Render the timemaster configuration
      ansible.builtin.template:
        src: ../../templates/timemaster.conf.j2
        dest: /tmp/timemaster.conf
        mode: "0644"
