# Ansible playbook that measures the latency of SEAPATH machines with
# cyclictest and fetches the histogram to the control machine.
#
# This playbook runs the role independently of the functional tests, so an
# operator can measure latency on any SEAPATH machine.
#
# Nothing on the machines is changed: the role copies a script to a temporary
# directory, runs cyclictest, fetches the result and leaves.

---
- name: Measure the latency with cyclictest
  hosts:
    - cluster_machines
    - standalone_machine
    - VMs
  become: true
  gather_facts: false
  roles:
    - cyclictest
