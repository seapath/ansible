# Deploy seapath-alloc on hypervisors: CPU allocation pool, QEMU hook,
# Prometheus textfile exporter, and NIC IRQ affinity integration.

---
- name: Deploy seapath-alloc
  hosts: hypervisors
  gather_facts: false
  become: true
  roles:
    # On Yocto the root filesystem is read-only: seapath-alloc must be
    # shipped by the image itself (meta-seapath).
    - role: seapath_alloc
      when: seapath_distro != "Yocto"
