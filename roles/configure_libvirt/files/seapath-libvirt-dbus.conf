<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Generated by Ansible (configure_libvirt). Do not edit. -->
<!-- Non-root access to libvirt is disabled. libvirt-dbus reaches libvirt as
     its own trusted user, so the libvirt group, which its policy allows,
     must not be able to call it either. root keeps access. -->
<busconfig>
  <policy group="libvirt">
    <deny send_destination="org.libvirt"/>
  </policy>
</busconfig>
