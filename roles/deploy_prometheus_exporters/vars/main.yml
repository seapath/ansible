---
deploy_prometheus_exporters_supported_exporters:
  - node-exporter
  - podman-exporter
  - libvirt-exporter
  - seapath-exporter
  - ha_cluster_exporter
  - smartctl-exporter

deploy_prometheus_exporters_default_images:
  node-exporter: quay.io/prometheus/node-exporter:latest
  podman-exporter: quay.io/navidys/prometheus-podman-exporter
  libvirt-exporter: ghcr.io/inovex/prometheus-libvirt-exporter:2.3.1
  seapath-exporter: ghcr.io/seapath/seapath-exporter:0.1.0
  ha_cluster_exporter: docker.io/insatomcat/ha-cluster-exporter:0.0.1
  smartctl-exporter: quay.io/prometheuscommunity/smartctl-exporter:v0.14.0

deploy_prometheus_exporters_group_exporters:
  # The machines of a cluster and the hypervisors are the physical ones: the
  # smartctl exporter is in both lists, for an observer and for a standalone
  # hypervisor.
  cluster_machines:
    - ha_cluster_exporter
    - smartctl-exporter
  hypervisors:
    - podman-exporter
    - libvirt-exporter
    - seapath-exporter
    - smartctl-exporter

deploy_prometheus_exporters_lvm_deployed: >-
  {{
    deploy_prometheus_exporters_enabled | bool
    and deploy_prometheus_exporters_lvm_enabled | bool
    and 'node-exporter' in deploy_prometheus_exporters_exporters
    and deploy_prometheus_exporters_lvm_binary.stat.exists
  }}
