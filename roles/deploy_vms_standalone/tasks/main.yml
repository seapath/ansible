---
- name: List all VMs
  community.libvirt.virt:
    command: list_vms
  register: deploy_vms_standalone_all_vms

# Runs first so invalid disk entries fail before the existing VM is
# destroyed (force) or any disk is staged.
- name: Normalize additional disk file names for the VM templates
  ansible.builtin.include_tasks: normalize_additional_disk.yml
  vars:
    _vm_name: "{{ item }}"
  loop: "{{ groups['VMs'] }}"
  when:
    - hostvars[item].additional_disk is defined
    - item not in deploy_vms_standalone_all_vms.list_vms or (item in deploy_vms_standalone_all_vms.list_vms and hostvars[item].force is defined and hostvars[item].force)

- name: Stop VM
  community.libvirt.virt:
    state: destroyed
    name: "{{ item }}"
  when:
    - item in deploy_vms_standalone_all_vms.list_vms
    - hostvars[item].force is defined
    - hostvars[item].force
  loop: "{{ groups['VMs'] }}"

- name: Undefine VM
  ansible.builtin.command: "virsh undefine --nvram {{ item }}"
  when:
    - item in deploy_vms_standalone_all_vms.list_vms
    - hostvars[item].force is defined
    - hostvars[item].force
  loop: "{{ groups['VMs'] }}"
  changed_when: true

- name: Print info
  ansible.builtin.debug:
    var: hostvars[item]
    verbosity: 2
  loop: "{{ groups['VMs'] }}"

- name: Check tmp folder permission
  ansible.builtin.file:
    path: "{{ deploy_vms_standalone_qcow2tmpuploadfolder }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  when:
    - deploy_vms_standalone_qcow2tmpuploadfolder is defined
    - deploy_vms_standalone_qcow2tmpuploadfolder != "/tmp"

- name: Stage the system disk on target  # noqa: var-naming[no-role-prefix]
  ansible.builtin.include_role:
    name: stage_vm_disk
  vars:
    deploy_vms_standalone_disk_extension: "{{ 'img.gz' if hostvars[item].disk_extract is defined and hostvars[item].disk_extract | bool else 'qcow2' }}"
    stage_vm_disk_label: "{{ item }}"
    stage_vm_disk_destination: "{{ deploy_vms_standalone_disk_pool }}/{{ hostvars[item].inventory_hostname }}.{{ deploy_vms_standalone_disk_extension }}"
    stage_vm_disk_source: "{{ hostvars[item].vm_disk | default('') }}"
    stage_vm_disk_fallback_source: "{{ deploy_vms_standalone_vms_disks_directory ~ '/' ~ item ~ '.' ~ deploy_vms_standalone_disk_extension if deploy_vms_standalone_vms_disks_directory | length > 0 else '' }}"
    stage_vm_disk_checksum: "{{ hostvars[item].vm_disk_checksum | default({}) }}"
    stage_vm_disk_remote_tmp: "{{ deploy_vms_standalone_qcow2tmpuploadfolder }}"
  when:
    - deploy_vms_standalone_disk_copy | bool
    - item not in deploy_vms_standalone_all_vms.list_vms or (item in deploy_vms_standalone_all_vms.list_vms and hostvars[item].force is defined and hostvars[item].force)
  loop: "{{ groups['VMs'] }}"

- name: Extract the gzipped disk on target
  ansible.builtin.command:
    cmd: "gzip -d -f {{ deploy_vms_standalone_disk_pool }}/{{ hostvars[item].inventory_hostname }}.img.gz"
    creates: "{{ deploy_vms_standalone_disk_pool }}/{{ hostvars[item].inventory_hostname }}.img"
  when:
    - deploy_vms_standalone_disk_copy | bool
    - hostvars[item].disk_extract is defined
    - hostvars[item].disk_extract | bool
    - item not in deploy_vms_standalone_all_vms.list_vms or (item in deploy_vms_standalone_all_vms.list_vms and hostvars[item].force is defined and hostvars[item].force)
  loop: "{{ groups['VMs'] }}"

- name: Stage additional disks on target
  ansible.builtin.include_tasks: stage_additional_disk.yml
  vars:
    _vm_name: "{{ item }}"
  loop: "{{ groups['VMs'] }}"
  when:
    - hostvars[item].additional_disk is defined
    - deploy_vms_standalone_disk_copy | bool
    - item not in deploy_vms_standalone_all_vms.list_vms or (item in deploy_vms_standalone_all_vms.list_vms and hostvars[item].force is defined and hostvars[item].force)

- name: Build cloud-init seed disks on target
  ansible.builtin.include_tasks: cloud_init_seed.yml
  vars:
    _vm_name: "{{ item }}"
  loop: "{{ groups['VMs'] }}"
  when:
    - hostvars[item].cloud_init is defined
    - item not in deploy_vms_standalone_all_vms.list_vms or (item in deploy_vms_standalone_all_vms.list_vms and hostvars[item].force is defined and hostvars[item].force)

- name: Add main disk to disk list
  # This is only done in standalone because the disk is handled by vm-manager in the cluster
  ansible.builtin.set_fact:
    standalone_main_disk: "{{ hostvars[item].inventory_hostname }}.qcow2" # noqa: var-naming[no-role-prefix]
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['VMs'] }}"
  when: item not in deploy_vms_standalone_all_vms.list_vms or (item in deploy_vms_standalone_all_vms.list_vms and hostvars[item].force is defined and hostvars[item].force)

- name: Export VM config for debug in /tmp # noqa: risky-file-permissions
  ansible.builtin.template:
    src: "{{ hostvars[item].vm_template }}"
    dest: "/tmp/{{ hostvars[item].inventory_hostname }}.xml"
  vars:
    vm: "{{ hostvars[item] }}"
  when: ansible_verbosity >= 2
  loop: "{{ groups['VMs'] }}"

- name: Create VMs
  community.libvirt.virt:
    command: define
    xml: >-
      {{ lookup('template',
      hostvars[item].vm_template,
      template_vars=dict(vm=hostvars[item])) }}
  loop: "{{ groups['VMs'] }}"
  when: item not in deploy_vms_standalone_all_vms.list_vms or (item in deploy_vms_standalone_all_vms.list_vms and hostvars[item].force is defined and hostvars[item].force)

- name: Start VMs
  community.libvirt.virt:
    name: "{{ item }}"
    state: running
    autostart: "{{ hostvars[item].autostart | default(true) }}"
  loop: "{{ groups['VMs'] }}"
  when: hostvars[item].enable | default(true)
