---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: proxy
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    privileged: true
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/.."
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      proxy:
        seapath_distro: Debian
        ip_addr: 10.10.10.10
        deploy_metrics_proxy_enabled: true
        deploy_metrics_proxy_manage_services: false
        deploy_metrics_proxy_exporters:
          - node-exporter
          - ha_cluster_exporter
        deploy_metrics_proxy_serve_ceph: true
        deploy_metrics_proxy_tls_cert: /tmp/molecule-metrics-proxy-cert.pem
        deploy_metrics_proxy_tls_key: /tmp/molecule-metrics-proxy-key.pem
        deploy_metrics_proxy_tls_client_ca: /tmp/molecule-metrics-proxy-ca.pem

verifier:
  name: ansible
