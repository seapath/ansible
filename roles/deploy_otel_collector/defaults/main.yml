---
# One OpenTelemetry collector per node, as a podman quadlet next to the
# exporters it scrapes.
#
# Turning this on does two things at once, which is the point: the exporters
# move to the loopback (deploy_prometheus_exporters and cephadm read this very
# variable to decide where they bind), and this collector becomes the single
# endpoint the node exposes on the administration network. One port, one
# certificate, one TLS policy, instead of six HTTP endpoints in the clear whose
# support for TLS is uneven and unconfigured.
#
# The model stays pull: the central Prometheus keeps scraping, so a dead node
# is still a target that goes down immediately. Pushing outwards is a separate
# decision, not a consequence of this one.
deploy_otel_collector_enabled: false

# Pinned, and pinned deliberately: opentelemetry-collector-contrib releases
# every two weeks and component configuration moves between releases. A
# substation is touched once a year, so the tag is a version this repository
# has read the configuration reference of, and raising it is a reviewed change.
deploy_otel_collector_image: >-
  ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.161.0

# The single endpoint this node exposes. 9464 is the conventional port of the
# collector's Prometheus exporter.
deploy_otel_collector_listen_address: "{{ ip_addr | default(ansible_host) }}"
deploy_otel_collector_listen_port: 9464

# Server certificate and key, as paths on the Ansible machine, in the same
# shape as the syslog client's TLS material.
# deploy_otel_collector_tls_cert: /path/to/servercert.pem
# deploy_otel_collector_tls_key: /path/to/serverkey.pem
#
# Without them the node signs its own, so that deploying this role never
# produces a cleartext endpoint while a site is still deciding what issues its
# certificates. A self signed certificate hides the metrics from anyone
# listening on the administration network, and it proves nothing about who is
# answering: an operator who wants that pins the fingerprint this role prints,
# or replaces the certificate with one of their PKI, which is the same two
# variables above.
deploy_otel_collector_tls_self_signed: true
# Ten years. The certificate secures a link inside a substation, it is not
# read by a browser, and an expiry is a monitoring outage nobody is watching
# for.
deploy_otel_collector_tls_self_signed_days: 3650
# A certificate this close to its expiry is replaced on the next run.
deploy_otel_collector_tls_renew_before_days: 30
#
# The CA that client certificates are verified against. Set it to require
# mutual TLS: the central Prometheus then presents a certificate and nothing
# else can read the metrics of this node. It works with a self signed server
# certificate too, and it is the only thing that turns confidentiality into
# access control.
# deploy_otel_collector_tls_client_ca: /path/to/clientca.pem
deploy_otel_collector_tls_dir: /etc/otelcol/cert.d
deploy_otel_collector_tls_min_version: "1.2"

# Both empty, so that by default this collector emits no identity of its own
# and changes nothing for the Prometheus reading it: cluster and nodename are
# static labels of the target file today, and they keep coming from there (see
# roles/seapath_alloc/PROMETHEUS.md).
#
# Setting them moves that identity to the node, which is worth it for a site
# that would rather each machine answer for itself than maintain a target file.
# It takes the whole pair, and it takes the values the target file already
# uses: with honor_labels on the Prometheus side, what the node sends wins, so
# a nodename that differs from the one in use renames a series without failing
# anything.
deploy_otel_collector_cluster: ""
deploy_otel_collector_nodename: ""

# The address the `instance` label is rewritten to. The targets are scraped on
# 127.0.0.1, so without this every node would report the same instance and the
# single-node dashboard would collapse them into one.
deploy_otel_collector_instance_address: "{{ ip_addr | default(ansible_host) }}"

deploy_otel_collector_scrape_interval: 15s

# Where the collector serves its own metrics, on the loopback, and where it
# scrapes itself: what it accepted, what it failed to send and how close to its
# memory ceiling it is leave the node through the same single endpoint as
# everything else. Written explicitly rather than left to the collector, whose
# older versions served this on every interface, so the address is read in the
# configuration instead of inferred from the version installed.
deploy_otel_collector_self_port: 8888

# The exporters running on this host. Derived from the inventory groups the
# same way deploy_prometheus_exporters derives its own list, and taken straight
# from that role when both are applied in the same play.
deploy_otel_collector_exporters: >-
  {{
    deploy_prometheus_exporters_exporters | default(
      (
        ['node-exporter']
        + (
          deploy_otel_collector_group_exporters.cluster_machines
          if inventory_hostname in groups.get('cluster_machines', [])
          else []
        )
        + (
          deploy_otel_collector_group_exporters.hypervisors
          if inventory_hostname in groups.get('hypervisors', [])
          else []
        )
      ) | unique
    )
  }}

# The Ceph mgr prometheus module, which is deployed by cephadm and not by the
# exporters role, so it is selected on its own.
deploy_otel_collector_scrape_ceph: >-
  {{
    inventory_hostname in groups.get('cluster_machines', [])
    and (cephadm_prometheus_exporter_enabled | default(true) | bool)
  }}

# Memory ceiling of the collector process, enforced by the collector itself:
# it starts refusing data rather than growing on a machine that also runs real
# time guests.
deploy_otel_collector_memory_limit_mib: 256
deploy_otel_collector_memory_spike_limit_mib: 64

# How long a metric stays exposed without a fresh scrape behind it. Past this,
# the collector stops serving it and the central Prometheus sees a series end.
#
# Two scrape intervals, which is the floor that carries a series across one
# missed scrape. It is this short because of the collector's accumulator: when
# one scrape drops several series of the same metric, it removes one of them
# and serves the rest until this expiry. A label whose value identifies a
# moving object therefore leaves a stale copy behind, and
# `ha_cluster_pacemaker_resources` carries two of them, `node` and `role`, both
# of which change when the cluster migrates a guest. A reader of this endpoint
# then sees the guest on the node it left and on the node it reached at once,
# and this value is how long that lasts. Measured on 0.161.0.
deploy_otel_collector_metric_expiration: 30s

# Housekeeping CPUs. Left empty, the role computes the complement of `isolcpus`
# and pins the container there: this service must never compete with a real
# time guest. On a machine with no isolated CPU the container is left unpinned.
deploy_otel_collector_cpu_affinity: ""
deploy_otel_collector_cpu_quota: 25%
deploy_otel_collector_nice: 5

deploy_otel_collector_manage_services: true
deploy_otel_collector_register_essential_services: true
deploy_otel_collector_cukinia_extra_essential_services_dir: /etc/cukinia/extra-essential-services.d
deploy_otel_collector_cukinia_extra_essential_services_file: "{{ deploy_otel_collector_cukinia_extra_essential_services_dir }}/deploy_otel_collector"
