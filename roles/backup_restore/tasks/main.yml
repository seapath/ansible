---
- name: Synchronization of backup-restore folder on the control machine to dest on the remote hosts
  ansible.posix.synchronize:
    use_ssh_args: true
    src: scripts/
    dest: /usr/local/bin/
    rsync_opts:
      - "--chown=root:root"
      - "--exclude=*.j2"

- name: Copy backup-restore templates
  ansible.builtin.template:
    src: "{{ item }}"
    dest: /usr/local/bin/{{ item | basename | regex_replace('\.j2$', '') }}
    mode: "0755"
  with_fileglob:
    - scripts/*.j2

- name: Ensure deployed scripts are owned by root
  ansible.builtin.file:
    path: /usr/local/bin/{{ item | basename | regex_replace('\.j2$', '') }}
    owner: root
    group: root
  loop: "{{ lookup('ansible.builtin.fileglob', role_path ~ '/files/scripts/*', wantlist=True) }}"
  loop_control:
    label: "{{ item | basename }}"

# Whether the inventory describes the backups at all. A site that has always
# driven the whiptail menu says nothing about them, and its file is left as it
# is: the two tasks after this one are the behaviour the role has always had.
# Setting any of the seven makes the inventory the source of truth, and the
# file is rendered from it on every machine at every convergence.
- name: Check whether the inventory describes the backups
  ansible.builtin.set_fact:
    backup_restore_from_inventory: "{{
      [backup_restore_local_dir, backup_restore_local_tmp_dir, backup_restore_remote_serv,
       backup_restore_remote_dir, backup_restore_include_vm, backup_restore_exclude_vm]
      | select('truthy') | list | length > 0 }}"

- name: Render /etc/backup-restore.conf from the inventory
  ansible.builtin.template:
    src: backup-restore.conf.j2
    dest: /etc/backup-restore.conf
    mode: "0644"
    owner: root
    group: root
  when: backup_restore_from_inventory | bool

# backup_full.sh creates the dated directory it assembles a backup in, but
# not the directory above it, so a staging directory that was never created
# fails the first backup after the whole list of guests has been printed. They
# are root's only: they hold the disks of every guest backed up.
- name: Create the directories the backups are staged in
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ [backup_restore_local_dir, backup_restore_local_tmp_dir] | select('truthy') | list }}"

- name: Create the key the backups are pushed with
  when: backup_restore_ssh_key | length > 0
  block:
    - name: Create the directory of that key
      ansible.builtin.file:
        path: "{{ backup_restore_ssh_key | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # Generated once and never replaced: its public half is installed on the
    # backup server, and a new key would lock every machine out of it.
    - name: Generate the key pair
      ansible.builtin.command:
        cmd: >-
          ssh-keygen -q -t ed25519 -N ''
          -C {{ ('backup_restore@' ~ inventory_hostname) | quote }}
          -f {{ backup_restore_ssh_key | quote }}
        creates: "{{ backup_restore_ssh_key }}"

- name: Trust the host key of the backup server
  ansible.builtin.known_hosts:
    path: /root/.ssh/known_hosts
    name: "{{ item.split()[0] }}"
    key: "{{ item }}"
    state: present
  loop: "{{ backup_restore_remote_host_keys }}"

- name: Create /etc/backup-restore.conf file
  ansible.builtin.file:
    path: "/etc/backup-restore.conf"
    state: touch
    mode: "0644"
    owner: root
    group: root
  when: not (backup_restore_from_inventory | bool)
  changed_when: false
- name: Check configuration of backup-restore.sh tool (remote_shell)
  ansible.builtin.shell: 'grep -c "^remote_shell=" /etc/backup-restore.conf || true'
  register: backup_restore_check_remote_shell
  when: not (backup_restore_from_inventory | bool)
  changed_when: true
- name: Add default configuration of backup-restore.sh tool (remote_shell)
  ansible.builtin.lineinfile:
    dest: /etc/backup-restore.conf
    regexp: "^remote_shell="
    line: "remote_shell=\"ssh\""
    state: present
  when:
    - not (backup_restore_from_inventory | bool)
    - backup_restore_check_remote_shell.stdout == "0"
