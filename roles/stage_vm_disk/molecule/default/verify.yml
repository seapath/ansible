---
- name: Verify
  hosts: hv1
  gather_facts: false
  tasks:
    - name: Stat staged disks
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        get_checksum: true
      register: stage_vm_disk_test_staged
      loop:
        - "{{ stage_vm_disk_test_directory }}/vm-local.qcow2"
        - "{{ stage_vm_disk_test_directory }}/vm-upper-padded-checksum.qcow2"
        - "{{ stage_vm_disk_test_directory }}/vm-remote.qcow2"
        - "{{ stage_vm_disk_test_directory }}/vm-fallback.qcow2"
        - "{{ stage_vm_disk_test_directory }}/vm-checksum-preference.qcow2"
        - "{{ stage_vm_disk_test_directory }}/guest.qcow2"
        - "{{ stage_vm_disk_test_remote_directory }}/guest.qcow2"
        - "{{ stage_vm_disk_test_remote_directory }}/guest%20copy.qcow2"
        - "{{ stage_vm_disk_test_remote_directory }}/images%2Fnested.qcow2"

    - name: Assert staged disks match the source checksum
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.checksum == stage_vm_disk_test_sha256
        fail_msg: "{{ item.item }} is missing or does not match the source disk."
      loop: "{{ stage_vm_disk_test_staged.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Stat the sub path an encoded path separator would have created
      ansible.builtin.stat:
        path: "{{ stage_vm_disk_test_remote_directory }}/images"
      register: stage_vm_disk_test_decoded_sub_path

    - name: Assert the encoded path separator never became a sub path
      ansible.builtin.assert:
        that: not stage_vm_disk_test_decoded_sub_path.stat.exists
        fail_msg: "{{ stage_vm_disk_test_remote_directory }}/images exists, the derived file name was URL-decoded into a path."

    - name: Stat the remote tmp directories passed to the role
      ansible.builtin.stat:
        path: "{{ item }}"
      register: stage_vm_disk_test_remote_tmp
      loop:
        - "{{ stage_vm_disk_test_remote_tmp_local }}"
        - "{{ stage_vm_disk_test_remote_tmp_remote }}"

    - name: Assert the role staged through the remote tmp directories it was given
      ansible.builtin.assert:
        that: item.stat.isdir | default(false)
        fail_msg: "{{ item.item }} was not created, stage_vm_disk_remote_tmp did not reach ansible_remote_tmp."
      loop: "{{ stage_vm_disk_test_remote_tmp.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: List the files in the staging directories
      ansible.builtin.find:
        paths: "{{ item }}"
        file_type: file
      register: stage_vm_disk_test_found
      loop:
        - "{{ stage_vm_disk_test_directory }}"
        - "{{ stage_vm_disk_test_remote_directory }}"

    - name: Assert only the successfully staged disks exist, rejected attempts left nothing behind
      ansible.builtin.assert:
        that: item.0.files | map(attribute='path') | map('basename') | sort == item.1 | sort
        fail_msg: "Unexpected files in {{ item.0.item }}: {{ item.0.files | map(attribute='path') | map('basename') | sort | difference(item.1) }}, missing: {{ item.1 | difference(item.0.files | map(attribute='path') | map('basename')) }}."
      loop: "{{ stage_vm_disk_test_found.results | zip(stage_vm_disk_test_expected_files) | list }}"
      loop_control:
        label: "{{ item.0.item }}"
      vars:
        stage_vm_disk_test_expected_files:
          - - vm-local.qcow2
            - vm-upper-padded-checksum.qcow2
            - vm-remote.qcow2
            - vm-fallback.qcow2
            - vm-checksum-preference.qcow2
            - guest.qcow2
          - - guest.qcow2
            - guest%20copy.qcow2
            - images%2Fnested.qcow2
