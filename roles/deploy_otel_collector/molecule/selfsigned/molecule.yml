---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: lonely
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    privileged: true
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/.."
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      lonely:
        seapath_distro: Debian
        ip_addr: 10.10.10.11
        deploy_otel_collector_enabled: true
        deploy_otel_collector_manage_services: false
        # No certificate given: the node signs its own rather than serving the
        # metrics of a hypervisor in the clear.
        deploy_otel_collector_exporters:
          - node-exporter
        deploy_otel_collector_scrape_ceph: false

verifier:
  name: ansible
