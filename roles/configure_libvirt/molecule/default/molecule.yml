---
dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: hv1
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    privileged: true
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/.."
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      hv1:
        seapath_distro: Debian
        # There is no libvirt in the container to restart.
        configure_libvirt_allow_non_root_libvirt_socket_access: false
        configure_libvirt_tap_link_speed: 1000

verifier:
  name: ansible
