---
- name: Detect the syslog-ng configuration version
  when: syslog_config_version is not defined
  block:
    - name: Read the installed syslog-ng version
      become: true
      ansible.builtin.command: syslog-ng --version
      register: syslog_ng_client_version_cmd
      changed_when: false
      failed_when: false

    - name: Set the configuration version from the installed syslog-ng
      ansible.builtin.set_fact: # noqa: var-naming[no-role-prefix]
        # A version above the installed one makes syslog-ng refuse the
        # configuration, so fall back rather than guess when the parsing fails.
        syslog_config_version: >-
          {{ syslog_ng_client_detected[0]
             if syslog_ng_client_detected else syslog_config_version_fallback }}
      vars:
        syslog_ng_client_detected: >-
          {{ syslog_ng_client_version_cmd.stdout | default('')
             | regex_findall('syslog-ng\s+\d+\s+\((\d+\.\d+)') }}

- name: Create /var/log/syslog-ng folder on hosts
  become: true
  ansible.builtin.file:
    path: /var/log/syslog-ng
    state: directory
    mode: "0755"

- name: Create the syslog-ng disk buffer directory
  become: true
  when: syslog_disk_buffer | bool
  ansible.builtin.file:
    path: "{{ syslog_disk_buffer_dir }}"
    state: directory
    # The buffer holds message payloads, keep it readable by root only.
    mode: "0700"

- name: Copy syslog-ng conf file
  become: true
  ansible.builtin.template:
    src: "{{ syslog_conf_template }}"
    dest: /etc/syslog-ng/syslog-ng.conf
    mode: "0644"
  notify: Restart syslog-ng

- name: Configure syslog-ng TLS client certificates if needed
  become: true
  when:
    - syslog_tls_ca is defined
    - syslog_tls_key is defined
    - syslog_tls_server_ca is defined
  block:
    - name: Create /etc/syslog-ng/cert.d
      ansible.builtin.file:
        path: /etc/syslog-ng/cert.d
        state: directory
        mode: "0755"
      notify: Restart syslog-ng
    - name: Create /etc/syslog-ng/ca.d
      ansible.builtin.file:
        path: /etc/syslog-ng/ca.d/
        state: directory
        mode: "0755"
      notify: Restart syslog-ng
    - name: Copy syslog client certificate
      ansible.builtin.copy:
        src: "{{ syslog_tls_ca }}"
        dest: /etc/syslog-ng/cert.d/clientcert.pem
        mode: "0644"
      notify: Restart syslog-ng
    - name: Copy syslog key
      ansible.builtin.copy:
        src: "{{ syslog_tls_key }}"
        dest: /etc/syslog-ng/cert.d/clientkey.pem
        mode: "0400"
      notify: Restart syslog-ng
    - name: Copy syslog server ca
      ansible.builtin.copy:
        src: "{{ syslog_tls_server_ca }}"
        dest: /etc/syslog-ng/ca.d/serverca.pem
        mode: "0644"
      notify: Restart syslog-ng
