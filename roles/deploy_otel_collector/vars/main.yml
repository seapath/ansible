---
# Where each exporter answers on the loopback, and under which job name its
# metrics leave this node. The job names are the ones
# roles/seapath_alloc/PROMETHEUS.md documents, so the series keep the
# name they have today and alerting rules written against them still match.
#
# An exporter absent from this map fails the run: the list of exporters is
# derived from the inventory groups, so a new exporter added to
# deploy_prometheus_exporters without a line here would silently stop being
# scraped the day the collector is turned on.
deploy_otel_collector_target_map:
  node-exporter:
    job: node
    port: 9100
  podman-exporter:
    job: podman_exporter
    port: 9882
  libvirt-exporter:
    job: libvirt_exporter
    port: 9177
  insatomcat-exporter:
    job: seapath_custom_exporter
    port: 9184
  ha_cluster_exporter:
    job: ha
    port: 9664

# Mirrors deploy_prometheus_exporters_group_exporters. The two roles are
# normally applied in the same play, where the exporters role's own list wins;
# this copy is what makes the collector usable on its own.
deploy_otel_collector_group_exporters:
  cluster_machines:
    - ha_cluster_exporter
  hypervisors:
    - podman-exporter
    - libvirt-exporter
    - insatomcat-exporter

deploy_otel_collector_ceph_job: ceph
deploy_otel_collector_ceph_port: 9283

# The job the collector's own metrics ride under. The port they are served on
# is a default rather than a var, since it is the one thing here that can
# collide with something else already running on a machine.
deploy_otel_collector_self_job: otelcol

deploy_otel_collector_config_dir: /etc/otelcol
deploy_otel_collector_config_file: /etc/otelcol/config.yaml
deploy_otel_collector_service: otelcol
