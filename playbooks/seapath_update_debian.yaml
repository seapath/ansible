---
- name: Make sure the debian_grub_bootcount is deployed
  hosts: all
  become: true
  roles:
    - debian_grub_bootcount

# One machine at a time. A machine that gets a new kernel leaves the cluster
# while it is upgraded and rebooted, and a cluster only keeps its guests
# running if the other members are up to take them while it does. A machine
# that fails stops the run before the next one is touched.
- name: Update Debian Systems
  hosts: all
  become: true
  serial: 1
  vars:
    update_debian_vg: "{{ vg_name | default('vg1') }}"
    # Below this, the snapshot would fill up during the upgrade and could not
    # be rolled back to. The run stops before anything changes instead.
    update_debian_snapshot_min_gib: "{{ snapshot_min_size_gib | default(2) }}"
  tasks:
    - name: Check if the machine is a cluster member
      ansible.builtin.stat:
        path: /etc/corosync/corosync.conf
      register: update_debian_corosync_conf

    - name: Check if the machine is part of a Ceph cluster
      ansible.builtin.stat:
        path: /etc/ceph/ceph.conf
      register: update_debian_ceph_conf

    # Everything that can refuse the update is asked before the machine is
    # touched: a refusal here leaves the guests where they are.
    - name: Read the logical volumes of the root volume group
      ansible.builtin.command:
        argv:
          - lvs
          - --noheadings
          - --nosuffix
          - --units
          - b
          - --separator
          - ","
          - -o
          - lv_name,lv_size
          - "{{ update_debian_vg }}"
      register: update_debian_lvs
      changed_when: false

    - name: Read the free space of the root volume group
      ansible.builtin.command:
        argv:
          - vgs
          - --noheadings
          - --nosuffix
          - --units
          - b
          - -o
          - vg_free
          - "{{ update_debian_vg }}"
      register: update_debian_vgs
      changed_when: false

    - name: Work out the size of the snapshot
      ansible.builtin.set_fact:
        update_debian_volumes: >-
          {{ dict(update_debian_lvs.stdout_lines
                  | map('trim') | map('split', ',')) }}
        update_debian_free: "{{ update_debian_vgs.stdout | trim | int }}"

    # A snapshot left by an update that never finished. lvol would find it
    # and report it created, and a rollback would then go back to whatever
    # the machine was when that one was taken.
    - name: Refuse a snapshot left by an earlier update
      ansible.builtin.fail:
        msg: >-
          {{ update_debian_vg }}/root-snap already exists. It was left by an
          earlier update that did not finish. Remove it with lvremove once the
          machine is known to be good, then update again.
      when: "'root-snap' in update_debian_volumes"

    # A snapshot never needs more than its origin. It gets the size of root
    # when the volume group has it, and what is free otherwise.
    - name: Refuse an update the volume group has no room to snapshot
      ansible.builtin.fail:
        msg: >-
          {{ update_debian_vg }} has
          {{ (update_debian_free | int / 1073741824) | round(1) }} GiB free,
          and the snapshot that lets the update be rolled back needs at least
          {{ update_debian_snapshot_min_gib }} GiB. Free some space in the
          volume group first.
      when:
        - snapshot_size is not defined
        - >-
          update_debian_free | int <
          (update_debian_snapshot_min_gib | float * 1073741824)

    # Only a new kernel needs the machine to reboot: every other package
    # takes effect when its service restarts, which the upgrade does. The
    # lists are refreshed here, and the upgrade installs what this simulation
    # read from them.
    - name: Refresh the package lists
      ansible.builtin.apt:
        update_cache: true

    - name: Ask apt what the upgrade would install
      ansible.builtin.command:
        argv:
          - apt-get
          - --simulate
          - dist-upgrade
      environment:
        LC_ALL: C
      register: update_debian_simulation
      changed_when: false

    - name: Read the kernel the machine booted
      ansible.builtin.command: uname -r
      register: update_debian_running_kernel
      changed_when: false

    - name: List the kernels installed
      ansible.builtin.find:
        paths: /boot
        patterns: vmlinuz-*
      register: update_debian_kernels

    # A kernel an earlier upgrade installed and the machine never booted is
    # also one the machine is behind on.
    - name: Decide whether the machine reboots
      ansible.builtin.set_fact:
        update_debian_reboot: >-
          {{ update_debian_simulation.stdout
             is search('^Inst linux-image-', multiline=True)
             or (update_debian_kernels.files | length > 0
                 and (update_debian_kernels.files
                      | map(attribute='path') | map('basename')
                      | map('regex_replace', '^vmlinuz-', '')
                      | community.general.version_sort | last)
                     != update_debian_running_kernel.stdout) }}

    # Debian stops pacemaker before unpacking a new one and restarts corosync
    # after, which stops pacemaker too. A member that stops pacemaker hands
    # its guests to the others, and a guest that cannot migrate live is
    # stopped. Without a reboot the cluster is told to leave every guest
    # where it is instead, which Pacemaker documents as its detach and
    # reattach upgrade. The option is cluster wide: the node attribute of the
    # same name must not be held across a restart of pacemaker.
    - name: Read whether the cluster is already in maintenance
      ansible.builtin.command: crm_attribute --type crm_config --name maintenance-mode --query --quiet
      register: update_debian_maintenance_mode
      changed_when: false
      failed_when: false
      when: update_debian_corosync_conf.stat.exists

    # A maintenance an operator set is theirs to end, and is left as found.
    - name: Decide whether the cluster is detached during the upgrade
      ansible.builtin.set_fact:
        update_debian_detach: >-
          {{ not update_debian_reboot
             and update_debian_corosync_conf.stat.exists
             and update_debian_simulation.stdout
                 is search('^Inst (pacemaker|corosync) ', multiline=True)
             and (update_debian_maintenance_mode.stdout | default('') | trim | lower)
                 not in ['true', 'on', 'yes', '1'] }}

    # The counter is what brings the machine back if the new system does not
    # boot. A grub.cfg that cannot find it would let the update go on
    # without that way back.
    - name: Check that GRUB can roll the new system back
      when: update_debian_reboot
      block:
        - name: Read the file system that holds the boot counter
          ansible.builtin.command: grub-probe --target=fs_uuid /boot/efi/bootcountenv
          register: update_debian_bootcount_uuid
          changed_when: false

        - name: Read the boot counter section of grub.cfg
          ansible.builtin.command: grep -qF -- "--set=bootcount_root {{ update_debian_bootcount_uuid.stdout }}" /boot/grub/grub.cfg
          register: update_debian_bootcount_cfg
          changed_when: false
          failed_when: update_debian_bootcount_cfg.rc > 1

        - name: Refuse an update GRUB could not roll back
          ansible.builtin.fail:
            msg: >-
              /boot/grub/grub.cfg does not look for the boot counter on file
              system {{ update_debian_bootcount_uuid.stdout }} (/boot/efi).
              Without it, a new system that does not boot is never rolled
              back. Run the debian_grub_bootcount role and update-grub, then
              update again.
          when: update_debian_bootcount_cfg.rc != 0

    - name: Update the machine
      block:
        - name: Make an LVM snapshot of the root lvm
          community.general.lvol:
            vg: "{{ update_debian_vg }}"
            lv: root
            snapshot: root-snap
            size: >-
              {{ snapshot_size | default(
                   '100%ORIGIN'
                   if update_debian_free | int >= update_debian_volumes.root | int
                   else '100%FREE') }}

        # What the machine must undo itself once its new system is up and
        # will not reboot again: this playbook may run on the machine it
        # updates, and then ends with the reboot. See system_check in the
        # debian_grub_bootcount role.
        - name: Make room for what the machine undoes after the reboot
          ansible.builtin.file:
            path: /boot/efi/seapath_update
            state: directory
            mode: "0700"

        # Only for a reboot. Without one, the guests stay where they are: a
        # guest that cannot be migrated live would be stopped and started on
        # another member, a longer outage than the upgrade itself causes.
        - name: Move the guests off the machine
          when:
            - update_debian_reboot
            - update_debian_corosync_conf.stat.exists
          block:
            - name: Have the machine leave standby after the reboot
              ansible.builtin.copy:
                content: ""
                dest: /boot/efi/seapath_update/standby
                mode: "0600"

            # Without --node, crm_attribute asks the cluster how it names
            # this machine. crm would take the hostname, which Pacemaker may
            # spell differently, and then change nothing. The standby is kept
            # across the reboot: were the machine to take guests back as
            # soon as it joins, they would be on a system that boot counting
            # may still reboot and roll back.
            - name: Put the machine in standby
              ansible.builtin.command: crm_attribute --type nodes --name standby --update on
              changed_when: true

            - name: Wait for the guests to leave the machine
              ansible.builtin.command: crm_resource --wait --timeout=600s
              changed_when: false

        # The OSDs of this machine go down with it. Without noout Ceph marks
        # them out after a few minutes and starts moving their data to the
        # other machines, only to move it back once the machine is up again.
        # The file is written first: a run that dies with the cluster
        # detached leaves the machine to end it at its next boot.
        - name: Detach the cluster from its guests
          when: update_debian_detach
          block:
            - name: Have the machine reattach the cluster after the reboot
              ansible.builtin.copy:
                content: ""
                dest: /boot/efi/seapath_update/maintenance
                mode: "0600"

            - name: Put the cluster in maintenance
              ansible.builtin.command: crm_attribute --type crm_config --name maintenance-mode --update true
              changed_when: true

        - name: Keep Ceph from rebalancing while the machine reboots
          when:
            - update_debian_reboot
            - update_debian_corosync_conf.stat.exists
            - update_debian_ceph_conf.stat.exists
          block:
            - name: Have the machine let Ceph rebalance after the reboot
              ansible.builtin.copy:
                content: ""
                dest: /boot/efi/seapath_update/noout
                mode: "0600"

            - name: Set the noout flag
              ansible.builtin.command: ceph osd set noout
              changed_when: true

        - name: Arm the rollback of the new system
          when: update_debian_reboot
          block:
            - name: Check if grub is password protected
              ansible.builtin.stat:
                path: /etc/grub.d/01_password
              register: grub_password

            - name: Disable password protection and update-grub
              ansible.builtin.shell:
                cmd: mv /etc/grub.d/01_password /etc/grub.d_01_password && update-grub
              changed_when: true
              when: grub_password.stat.exists

            - name: Enable Grub Boot Count
              ansible.builtin.command: /usr/bin/grub-editenv /boot/efi/bootcountenv set bootcount=0
              changed_when: true

        - name: Note that packages are about to change
          ansible.builtin.set_fact:
            update_debian_upgrading: true

        - name: Upgrade the OS (apt-get dist-upgrade)
          ansible.builtin.apt:
            install_recommends: false
            autoremove: true
            upgrade: dist

        # Ended only once this machine is back in a quorate partition and its
        # guests were probed again. Were it ended with pacemaker still down
        # here, the others would take this machine's guests for stopped and
        # start them a second time.
        - name: Reattach the cluster to its guests
          when: update_debian_detach
          block:
            - name: Wait for the machine to rejoin the cluster
              ansible.builtin.command: crm_node --quorum
              register: update_debian_quorum
              until: update_debian_quorum.stdout | trim == '1'
              retries: 60
              delay: 10
              changed_when: false
              failed_when: false

            - name: Fail if the machine did not rejoin the cluster
              ansible.builtin.fail:
                msg: >-
                  {{ inventory_hostname }} did not rejoin a quorate partition
                  after the upgrade restarted pacemaker and corosync.
              when: update_debian_quorum.stdout | default('') | trim != '1'

            - name: Wait for the guests to be probed again
              ansible.builtin.command: crm_resource --wait --timeout=600s
              changed_when: false

            - name: Take the cluster out of maintenance
              ansible.builtin.command: crm_attribute --type crm_config --name maintenance-mode --delete
              changed_when: true

            - name: Wait for the cluster to settle
              ansible.builtin.command: crm_resource --wait --timeout=600s
              changed_when: false

      # A failure before the reboot puts the machine back as it was found, as
      # far as that is known, and still fails the run so it is seen.
      rescue:
        - name: Disarm the boot counter
          ansible.builtin.command: /usr/bin/grub-editenv /boot/efi/bootcountenv set bootcount=disabled
          changed_when: true

        - name: Enable grub password protection again
          ansible.builtin.shell:
            cmd: mv /etc/grub.d_01_password /etc/grub.d/01_password && update-grub
            removes: /etc/grub.d_01_password
          when: grub_password.stat.exists | default(false)

        # Kept once packages may have changed: it is then the way back, by
        # hand, to the system as it was before the upgrade started.
        - name: Remove the snapshot, since nothing was upgraded
          ansible.builtin.command: "lvremove -y /dev/{{ update_debian_vg }}/root-snap"
          args:
            removes: "/dev/{{ update_debian_vg }}/root-snap"
          when: not (update_debian_upgrading | default(false))

        - name: Take the machine out of standby
          ansible.builtin.command: crm_attribute --type nodes --name standby --update off
          changed_when: true
          when:
            - update_debian_reboot
            - update_debian_corosync_conf.stat.exists

        # Not with pacemaker down here: the others would start this machine's
        # guests a second time. The maintenance is then left, with its file,
        # and the run fails saying so.
        - name: Read whether the machine is in the cluster
          ansible.builtin.command: crm_node --quorum
          register: update_debian_rescue_quorum
          changed_when: false
          failed_when: false
          when: update_debian_detach | default(false)

        - name: Take the cluster out of maintenance
          ansible.builtin.command: crm_attribute --type crm_config --name maintenance-mode --delete
          changed_when: true
          when:
            - update_debian_detach | default(false)
            - update_debian_rescue_quorum.stdout | default('') | trim == '1'

        - name: Let Ceph rebalance again
          ansible.builtin.command: ceph osd unset noout
          changed_when: true
          when:
            - update_debian_reboot
            - update_debian_corosync_conf.stat.exists
            - update_debian_ceph_conf.stat.exists

        - name: Leave the machine nothing to undo at the next boot
          ansible.builtin.file:
            path: /boot/efi/seapath_update
            state: absent
          when: >-
            not (update_debian_detach | default(false))
            or update_debian_rescue_quorum.stdout | default('') | trim == '1'

        - name: Fail, having put the machine back
          ansible.builtin.fail:
            msg: >-
              The update of {{ inventory_hostname }} failed at
              "{{ ansible_failed_task.name }}": {{ ansible_failed_result.msg
              | default('see the task above') }}.
              {{ 'Packages may have changed, and the snapshot '
                 ~ update_debian_vg ~ '/root-snap is kept as the way back.'
                 if update_debian_upgrading | default(false)
                 else 'Nothing was upgraded.' }}
              {{ 'The cluster is left in maintenance, since this machine is
                 not back in it: end it with crm_attribute --type crm_config
                 --name maintenance-mode --delete once it is.'
                 if update_debian_detach | default(false)
                    and update_debian_rescue_quorum.stdout | default('') | trim != '1'
                 else '' }}

    # Without a new kernel the upgrade is already in effect, and what the
    # machine would undo at boot is undone here instead. The guests never
    # left, so there is no standby to end.
    - name: Finish the update without a reboot
      when: not update_debian_reboot
      block:
        - name: Remove the snapshot
          ansible.builtin.command: "lvremove -y /dev/{{ update_debian_vg }}/root-snap"
          args:
            removes: "/dev/{{ update_debian_vg }}/root-snap"

        - name: Leave the machine nothing to undo at the next boot
          ansible.builtin.file:
            path: /boot/efi/seapath_update
            state: absent

    # The machine running this playbook cannot wait for its own reboot: the
    # run would die with it and never report. With detach_reboot, the reboot
    # is scheduled a few seconds out and the run ends first. The machine
    # finishes its update at boot all the same, and nothing is left to check
    # it from here.
    - name: Schedule the reboot and end the run
      ansible.builtin.command:
        argv:
          - systemd-run
          - --on-active=15
          - systemctl
          - reboot
      changed_when: true
      when:
        - update_debian_reboot
        - detach_reboot | default(false) | bool

    # Everything past the reboot is done by the machine itself, and what
    # follows only checks that it was.
    - name: Reboot into the new kernel
      when:
        - update_debian_reboot
        - not (detach_reboot | default(false) | bool)
      block:
        - name: Reboot and hope for the best
          ansible.builtin.reboot:
        - name: Wait for Connection
          ansible.builtin.wait_for_connection:

        # system_check removes the snapshot, enables the GRUB password again,
        # takes the machine out of standby and removes noout, then logs that it
        # is done.
        - name: Wait for the boot to be checked
          ansible.builtin.command: journalctl -b -t system_check -o cat
          register: update_debian_system_check
          until: >-
            'Boot check done' in update_debian_system_check.stdout or
            'Rebooting' in update_debian_system_check.stdout
          retries: 200
          delay: 10
          changed_when: false

        # The counter GRUB left for the first check of this boot.
        - name: Read the boot counter the machine booted with
          ansible.builtin.set_fact:
            update_debian_bootcount: >-
              {{ update_debian_system_check.stdout
                 | regex_search('bootcount was ([^!\s]+)', '\1')
                 | first }}

        # A failure here stops the run, so no other machine is updated after one
        # that could not boot its new system.
        - name: Fail if the new system does not come up
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }} booted its new system, but not cleanly, and
              is rebooting it. After three failed boots it goes back to the system
              it had before the update.
          when: "'Rebooting' in update_debian_system_check.stdout"

        # The initramfs disables the counter when it rolls back, so the boot
        # that follows finds it disabled.
        - name: Fail if the upgrade was rolled back
          ansible.builtin.fail:
            msg: "Upgrade has failed, and the system has been rolled back."
          when: update_debian_bootcount == 'disabled'

        # GRUB moves the counter from 0 to 1 when it reads it, so a 0 means this
        # boot was never counted and a failed one would not have been rolled
        # back.
        - name: Fail if GRUB did not read the boot counter
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }} was updated and boots, but GRUB never read
              the boot counter in /boot/efi/bootcountenv: had the new system
              failed to boot, it would not have been rolled back. The run stops
              before the next machine.
          when: update_debian_bootcount == '0'

        - name: Read the logical volumes left after the boot
          ansible.builtin.command: "lvs --noheadings -o lv_name {{ update_debian_vg }}"
          register: update_debian_lvs_after
          changed_when: false

        - name: Read what the machine has left to undo
          ansible.builtin.find:
            paths: /boot/efi/seapath_update
          register: update_debian_pending

        - name: Fail if the machine did not finish the update
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }} boots its new system, but did not
              {{ ((['remove the snapshot ' ~ update_debian_vg ~ '/root-snap']
                   if 'root-snap' in update_debian_lvs_after.stdout else [])
                   + (update_debian_pending.files | map(attribute='path')
                    | map('basename')
                    | map('replace', 'standby', 'leave standby')
                    | map('replace', 'noout', 'remove the Ceph noout flag')
                    | list))
                 | join(' and ') }}.
              See journalctl -b -t system_check there.
          when: >-
            'root-snap' in update_debian_lvs_after.stdout or
            update_debian_pending.matched > 0

        - name: Wait for the OSDs of the machine to be up
          ansible.builtin.command: ceph osd stat --format json
          register: update_debian_osd_stat
          until: >-
            (update_debian_osd_stat.stdout | from_json).num_up_osds ==
            (update_debian_osd_stat.stdout | from_json).num_osds
          retries: 60
          delay: 10
          changed_when: false
          when:
            - update_debian_corosync_conf.stat.exists
            - update_debian_ceph_conf.stat.exists
