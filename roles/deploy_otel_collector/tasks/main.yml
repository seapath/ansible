---
- name: Deploy the OpenTelemetry collector
  when: deploy_otel_collector_enabled | bool
  block:
    - name: Check every exporter of this host has a known endpoint
      ansible.builtin.assert:
        that:
          - deploy_otel_collector_exporters | length > 0
          - deploy_otel_collector_exporters
            | difference(deploy_otel_collector_target_map.keys() | list)
            | length == 0
        fail_msg: >-
          No endpoint is known for
          {{ deploy_otel_collector_exporters
             | difference(deploy_otel_collector_target_map.keys() | list)
             | join(', ') }}.
          An exporter this collector cannot scrape would stop being collected
          the moment the exporters move to the loopback, without anything
          failing. Add it to deploy_otel_collector_target_map.

    # Either a certificate is given, or the node signs its own. Both end up in
    # the same two files, so everything downstream reads one flag.
    - name: Decide what serves the TLS endpoint of this node
      ansible.builtin.set_fact:
        deploy_otel_collector_tls_provided: >-
          {{
            deploy_otel_collector_tls_cert is defined
            and deploy_otel_collector_tls_key is defined
          }}
        deploy_otel_collector_tls_enabled: >-
          {{
            (
              deploy_otel_collector_tls_cert is defined
              and deploy_otel_collector_tls_key is defined
            )
            or deploy_otel_collector_tls_self_signed | bool
          }}

    - name: Refuse to serve the metrics of this node in the clear
      ansible.builtin.assert:
        that:
          - deploy_otel_collector_tls_enabled | bool
        fail_msg: >-
          The collector listens on {{ deploy_otel_collector_listen_address }},
          which is reachable from the administration network, and
          deploy_otel_collector_tls_self_signed is off with no certificate
          given. Serving the whole observability surface of this node,
          including its real time tuning, over plain HTTP is what deploying
          this collector is meant to stop.
      when: deploy_otel_collector_listen_address not in ['127.0.0.1', 'localhost', '::1']

    # Written here rather than in the template so the value is one fact a
    # reader can print, and so the generated configuration stays a file an
    # operator can compare with what the role produced.
    - name: List the endpoints this collector scrapes
      ansible.builtin.set_fact:
        deploy_otel_collector_jobs: >-
          {{
            (
              deploy_otel_collector_exporters
              | map('extract', deploy_otel_collector_target_map)
              | list
            )
            + (
              [{'job': deploy_otel_collector_ceph_job,
                'port': deploy_otel_collector_ceph_port}]
              if deploy_otel_collector_scrape_ceph | bool
              else []
            )
            + [{'job': deploy_otel_collector_self_job,
                'port': deploy_otel_collector_self_port}]
          }}

    - name: Read the CPUs this machine has
      ansible.builtin.slurp:
        src: /sys/devices/system/cpu/present
      register: deploy_otel_collector_present_cpus
      when:
        - not deploy_otel_collector_cpu_affinity
        - isolcpus is defined

    # The complement of the isolated set, computed the same way the web UI role
    # computes it.
    - name: Compute the housekeeping CPUs
      ansible.builtin.set_fact:
        deploy_otel_collector_cpu_affinity: >-
          {% set isolated = [] %}
          {%- for part in (isolcpus | replace(' ', '')).split(',') if part -%}
          {%- set bounds = part.split('-') -%}
          {%- set _ = isolated.extend(range(bounds[0] | int, bounds[-1] | int + 1)) -%}
          {%- endfor -%}
          {{ range(0, ((deploy_otel_collector_present_cpus.content | b64decode | trim).split('-')[-1] | int) + 1)
             | difference(isolated) | sort | join(',') }}
      when:
        - not deploy_otel_collector_cpu_affinity
        - isolcpus is defined

    - name: Create the collector configuration directory
      ansible.builtin.file:
        path: "{{ deploy_otel_collector_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the TLS material of the collector
      when: deploy_otel_collector_tls_enabled | bool
      block:
        - name: Create the collector certificate directory
          ansible.builtin.file:
            path: "{{ deploy_otel_collector_tls_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0700"

        - name: Copy the collector certificate
          ansible.builtin.copy:
            src: "{{ deploy_otel_collector_tls_cert }}"
            dest: "{{ deploy_otel_collector_tls_dir }}/servercert.pem"
            owner: root
            group: root
            mode: "0644"
          when: deploy_otel_collector_tls_provided | bool
          notify: Restart the collector

        - name: Copy the collector key
          ansible.builtin.copy:
            src: "{{ deploy_otel_collector_tls_key }}"
            dest: "{{ deploy_otel_collector_tls_dir }}/serverkey.pem"
            owner: root
            group: root
            mode: "0600"
          when: deploy_otel_collector_tls_provided | bool
          notify: Restart the collector

        - name: Sign the certificate of this node when none is given
          when: not deploy_otel_collector_tls_provided | bool
          block:
            # One command answers both questions: a missing file and a
            # certificate about to expire both exit non zero, and an expired
            # certificate is a monitoring outage nobody is watching for.
            - name: Look for a certificate that is still valid
              ansible.builtin.command:
                cmd: >-
                  openssl x509 -noout
                  -checkend {{ deploy_otel_collector_tls_renew_before_days | int * 86400 }}
                  -in {{ deploy_otel_collector_tls_dir }}/servercert.pem
              register: deploy_otel_collector_cert_validity
              failed_when: false
              changed_when: false

            # The address is in the subjectAltName, not just the CN: a scraper
            # verifying this certificate connects to an address, and a CN alone
            # has not been accepted for that in years.
            - name: Sign the certificate of this node
              ansible.builtin.command:
                cmd: >-
                  openssl req -x509 -nodes -newkey rsa:4096
                  -days {{ deploy_otel_collector_tls_self_signed_days }}
                  -subj "/CN={{ inventory_hostname }}"
                  -addext "subjectAltName=IP:{{ deploy_otel_collector_listen_address }},DNS:{{ inventory_hostname }}"
                  -addext "extendedKeyUsage=serverAuth"
                  -keyout {{ deploy_otel_collector_tls_dir }}/serverkey.pem
                  -out {{ deploy_otel_collector_tls_dir }}/servercert.pem
              when: deploy_otel_collector_cert_validity.rc != 0
              changed_when: true
              notify: Restart the collector

            - name: Keep the private key readable by root only
              ansible.builtin.file:
                path: "{{ deploy_otel_collector_tls_dir }}/{{ item.name }}"
                owner: root
                group: root
                mode: "{{ item.mode }}"
              loop:
                - {name: serverkey.pem, mode: "0600"}
                - {name: servercert.pem, mode: "0644"}
              loop_control:
                label: "{{ item.name }}"

            # What an operator pins on the Prometheus side, or compares with
            # what their scraper reports. A self signed certificate is only
            # worth the fingerprint someone checked.
            - name: Read the fingerprint of the certificate this node serves
              ansible.builtin.command:
                cmd: >-
                  openssl x509 -noout -fingerprint -sha256
                  -in {{ deploy_otel_collector_tls_dir }}/servercert.pem
              register: deploy_otel_collector_cert_fingerprint
              changed_when: false

            - name: Show the fingerprint of the certificate this node serves
              ansible.builtin.debug:
                msg: "{{ deploy_otel_collector_cert_fingerprint.stdout | trim }}"

        - name: Copy the CA client certificates are verified against
          ansible.builtin.copy:
            src: "{{ deploy_otel_collector_tls_client_ca }}"
            dest: "{{ deploy_otel_collector_tls_dir }}/clientca.pem"
            owner: root
            group: root
            mode: "0644"
          when: deploy_otel_collector_tls_client_ca is defined
          notify: Restart the collector

    - name: Deploy the collector configuration
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ deploy_otel_collector_config_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart the collector

    - name: Ensure the quadlet directory exists
      ansible.builtin.file:
        path: /etc/containers/systemd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the collector container unit
      ansible.builtin.template:
        src: otelcol.container.j2
        dest: "/etc/containers/systemd/{{ deploy_otel_collector_service }}.container"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd after the collector unit changed
        - Restart the collector

    - name: Flush handlers before starting the collector
      ansible.builtin.meta: flush_handlers

    # Boot activation comes from the [Install] section of the quadlet unit:
    # systemd refuses to enable a generated unit, so there is nothing to enable
    # here.
    - name: Start the collector
      ansible.builtin.systemd:
        name: "{{ deploy_otel_collector_service }}"
        state: started
      when: deploy_otel_collector_manage_services | bool

    - name: Publish the collector for cukinia tests
      when: deploy_otel_collector_register_essential_services | bool
      block:
        - name: Ensure the cukinia extra essential services drop-in directory exists
          ansible.builtin.file:
            path: "{{ deploy_otel_collector_cukinia_extra_essential_services_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Publish the collector service for cukinia tests
          ansible.builtin.template:
            src: cukinia-extra-essential-services.j2
            dest: "{{ deploy_otel_collector_cukinia_extra_essential_services_file }}"
            owner: root
            group: root
            mode: "0644"

# A machine that never had the collector is left untouched: this branch exists
# to undo a deployment, and on every other node it is a single stat.
- name: Look for a collector unit to remove
  ansible.builtin.stat:
    path: "/etc/containers/systemd/{{ deploy_otel_collector_service }}.container"
  register: deploy_otel_collector_unit
  when: not deploy_otel_collector_enabled | bool

- name: Remove the OpenTelemetry collector
  when:
    - not deploy_otel_collector_enabled | bool
    - deploy_otel_collector_unit.stat.exists
  block:
    - name: Stop the collector
      ansible.builtin.systemd:
        name: "{{ deploy_otel_collector_service }}"
        state: stopped
      failed_when: false
      when: deploy_otel_collector_manage_services | bool

    # The unit and the configuration. The certificate directory is left alone:
    # deleting trust material is never a side effect of turning a service off.
    - name: Remove the collector container unit
      ansible.builtin.file:
        path: "/etc/containers/systemd/{{ deploy_otel_collector_service }}.container"
        state: absent
      notify: Reload systemd after the collector unit changed

    - name: Remove the collector configuration
      ansible.builtin.file:
        path: "{{ deploy_otel_collector_config_file }}"
        state: absent

    - name: Remove the collector cukinia extra services drop-in
      ansible.builtin.file:
        path: "{{ deploy_otel_collector_cukinia_extra_essential_services_file }}"
        state: absent

- name: Remove the collector cukinia extra services drop-in
  ansible.builtin.file:
    path: "{{ deploy_otel_collector_cukinia_extra_essential_services_file }}"
    state: absent
  when:
    - deploy_otel_collector_enabled | bool
    - not deploy_otel_collector_register_essential_services | bool
