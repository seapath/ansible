---
- name: Look up the trusted libvirt system user
  ansible.builtin.getent:
    database: passwd
    key: "{{ configure_libvirt_socket_trusted_user }}"
    fail_key: false
  when: configure_libvirt_socket_trusted_user | length > 0

- name: Look up the primary group of the trusted libvirt system user
  ansible.builtin.getent:
    database: group
    key: "{{ ansible_facts.getent_passwd[configure_libvirt_socket_trusted_user][2] }}"
  when:
    - configure_libvirt_socket_trusted_user | length > 0
    - ansible_facts.getent_passwd[configure_libvirt_socket_trusted_user] is not none

- name: Set the libvirt socket access policy
  ansible.builtin.set_fact:
    configure_libvirt_socket_trusted_group: "{{ _trusted_group }}"
    configure_libvirt_socket_group: >-
      {{ 'libvirt' if configure_libvirt_allow_non_root_libvirt_socket_access | bool
      else (_trusted_group or 'root') }}
    configure_libvirt_socket_mode: >-
      {{ '0660' if configure_libvirt_allow_non_root_libvirt_socket_access | bool
      or _trusted_group else '0600' }}
  vars:
    _trusted_group: >-
      {{ (ansible_facts.getent_group | default({}) | list | first | default(''))
      if configure_libvirt_socket_trusted_user | length > 0
      and ansible_facts.getent_passwd[configure_libvirt_socket_trusted_user] is not none
      else '' }}

- name: Check that the trusted user does not open libvirt to a shared group
  ansible.builtin.assert:
    that: configure_libvirt_socket_trusted_group not in ['libvirt', 'users']
    fail_msg: >-
      The primary group of {{ configure_libvirt_socket_trusted_user }} is
      {{ configure_libvirt_socket_trusted_group }}: giving it the libvirt
      sockets would let every member of that group reach libvirt. Give the
      user a dedicated group, or set configure_libvirt_socket_trusted_user to "".
    quiet: true

# With non-root access, the sockets belong to the libvirt group: the trusted
# user (libvirtdbus) is not a member of it on every distribution.
- name: Add the trusted libvirt system user to the libvirt group
  ansible.builtin.user:
    name: "{{ configure_libvirt_socket_trusted_user }}"
    groups: libvirt
    append: true
  when:
    - configure_libvirt_allow_non_root_libvirt_socket_access | bool
    - configure_libvirt_socket_trusted_group | length > 0

- name: Copy libvirtd.conf
  ansible.builtin.template:
    src: libvirtd.conf.j2
    dest: /etc/libvirt/libvirtd.conf
    owner: root
    group: root
    mode: "0644"
  register: configure_libvirt_libvirtd_conf

- name: Create libvirt socket drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ configure_libvirt_socket_units }}"

- name: Restrict libvirt socket permissions
  ansible.builtin.template:
    src: socket-access.conf.j2
    dest: "/etc/systemd/system/{{ item }}.d/seapath-socket-access.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ configure_libvirt_socket_units }}"
  register: configure_libvirt_socket_dropins

# Hosts without polkit (Yocto) rely on the socket permissions alone.
- name: Check for the polkit rules directory
  ansible.builtin.stat:
    path: /etc/polkit-1/rules.d
  register: configure_libvirt_polkit_rules_dir

- name: Deny libvirt polkit actions to non-root users
  ansible.builtin.template:
    src: 10-seapath-libvirt.rules.j2
    dest: /etc/polkit-1/rules.d/10-seapath-libvirt.rules
    owner: root
    group: root
    mode: "0644"
  when:
    - not configure_libvirt_allow_non_root_libvirt_socket_access | bool
    - configure_libvirt_polkit_rules_dir.stat.isdir | default(false)

- name: Remove the libvirt polkit restriction
  ansible.builtin.file:
    path: /etc/polkit-1/rules.d/10-seapath-libvirt.rules
    state: absent
  when: configure_libvirt_allow_non_root_libvirt_socket_access | bool

# libvirt-dbus reaches libvirt as the trusted user, and its D-Bus policy lets
# the libvirt group call it: close that path too. /etc/dbus-1/system.d is read
# after the packaged policies, so this rule wins for the libvirt group.
- name: Check for the D-Bus system policy directory
  ansible.builtin.stat:
    path: /etc/dbus-1/system.d
  register: configure_libvirt_dbus_policy_dir

- name: Deny the libvirt group access to libvirt-dbus
  ansible.builtin.copy:
    src: seapath-libvirt-dbus.conf
    dest: /etc/dbus-1/system.d/seapath-libvirt-dbus.conf
    owner: root
    group: root
    mode: "0644"
  when:
    - not configure_libvirt_allow_non_root_libvirt_socket_access | bool
    - configure_libvirt_socket_trusted_group | length > 0
    - configure_libvirt_dbus_policy_dir.stat.isdir | default(false)
  register: configure_libvirt_dbus_policy

- name: Remove the libvirt-dbus restriction
  ansible.builtin.file:
    path: /etc/dbus-1/system.d/seapath-libvirt-dbus.conf
    state: absent
  when: >-
    configure_libvirt_allow_non_root_libvirt_socket_access | bool
    or configure_libvirt_socket_trusted_group | length == 0
  register: configure_libvirt_dbus_policy_removed

- name: Reload the D-Bus policy
  ansible.builtin.systemd:
    name: dbus
    state: reloaded
  when: configure_libvirt_dbus_policy.changed or configure_libvirt_dbus_policy_removed.changed # noqa: no-handler

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: configure_libvirt_socket_dropins.changed # noqa: no-handler

# A socket only takes its new mode and group when it is recreated. The daemon
# and all its sockets are stopped in a single transaction, otherwise a client
# of a socket still listening (exporters, Pacemaker monitors, vm_manager) could
# reactivate the daemon and make systemd refuse the socket restart. Sockets
# that already have the expected mode and group are left alone, so a re-run
# with an unchanged policy does not restart anything, and a run interrupted
# before this step is caught up by the next one. One host at a time, so
# that a live migration in progress cannot lose both ends at once. Running
# VMs are not affected.
- name: Restart libvirt daemons whose sockets have stale permissions
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      svc="{{ item }}"
      expected="{{ configure_libvirt_socket_mode | regex_replace('^0', '') }} {{ configure_libvirt_socket_group }}"
      sockets=""
      stale=0
      for sock in "$svc.socket" "$svc-ro.socket" "$svc-admin.socket"; do
        systemctl is-active -q "$sock" || continue
        sockets="$sockets $sock"
        case "$sock" in *-admin.socket) continue ;; esac
        for path in $(systemctl show -P Listen "$sock" | sed -n 's/ (Stream)$//p'); do
          [ "$(stat -c '%a %G' "$path" 2>/dev/null)" = "$expected" ] || stale=1
        done
      done
      [ "$stale" = 1 ] || exit 0
      was_active=0
      systemctl is-active -q "$svc.service" && was_active=1
      # shellcheck disable=SC2086
      systemctl stop "$svc.service" $sockets
      # shellcheck disable=SC2086
      systemctl start $sockets
      [ "$was_active" = 0 ] || systemctl start "$svc.service"
      echo restarted
    executable: /bin/bash
  loop: >-
    {{ configure_libvirt_socket_units
    | map('regex_replace', '(-ro)?\.socket$', '') | unique | list }}
  throttle: 1
  register: configure_libvirt_socket_restart
  changed_when: "'restarted' in configure_libvirt_socket_restart.stdout"

# Restart libvirtd if its configuration changed, unless the step above already
# restarted it. Only where libvirtd is in use: on OracleLinux the modular
# daemons replace it, and starting it next to them must be avoided.
- name: Restart libvirtd
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      if systemctl is-active -q libvirtd.service || systemctl is-enabled -q libvirtd.service; then
        systemctl restart libvirtd.service
        echo restarted
      fi
    executable: /bin/bash
  when:
    - configure_libvirt_libvirtd_conf.changed
    - >-
      'libvirtd' not in (configure_libvirt_socket_restart.results | default([])
      | selectattr('changed') | map(attribute='item') | list)
  throttle: 1
  register: configure_libvirt_libvirtd_restart
  changed_when: "'restarted' in configure_libvirt_libvirtd_restart.stdout"

# OracleLinux specific
- name: Enable and start virtsecretd.socket
  ansible.builtin.systemd:
    name: virtsecretd.socket
    state: started
    enabled: true
  when: seapath_distro == "OracleLinux"
- name: Enable and start virtqemud.socket
  ansible.builtin.systemd:
    name: virtqemud.socket
    state: started
    enabled: true
  when: seapath_distro == "OracleLinux"
- name: Enable and start virtstoraged.socket
  ansible.builtin.systemd:
    name: virtstoraged.socket
    state: started
    enabled: true
  when: seapath_distro == "OracleLinux"

- name: Check configure_libvirt_tap_link_speed
  ansible.builtin.assert:
    that:
      - configure_libvirt_tap_link_speed | string is match('^[0-9]+$')
    fail_msg: >-
      configure_libvirt_tap_link_speed is {{ configure_libvirt_tap_link_speed }};
      it must be a speed in Mb/s, or 0 to disable the hook.
    quiet: true

- name: Configure the tap link speed hook
  when: configure_libvirt_tap_link_speed | int > 0
  block:
    - name: Ensure /etc/seapath exists
      ansible.builtin.file:
        path: /etc/seapath
        state: directory
        mode: "0755"

    - name: Write the tap link speed
      ansible.builtin.copy:
        content: |
          # Link speed in Mb/s set on the guest tap devices, managed by Ansible
          {{ configure_libvirt_tap_link_speed | int }}
        dest: /etc/seapath/tap-link-speed.conf
        owner: root
        group: root
        mode: "0644"

    - name: Ensure /etc/libvirt/hooks/qemu.d exists
      ansible.builtin.file:
        path: /etc/libvirt/hooks/qemu.d
        state: directory
        mode: "0755"

    # libvirt only discovers hook scripts when its QEMU daemon starts, so the
    # first install restarts it; later updates of the script do not need it.
    - name: Register the tap link speed hook with libvirt
      ansible.builtin.copy:
        src: seapath-tap-link-speed
        dest: /etc/libvirt/hooks/qemu.d/20-seapath-tap-link-speed
        owner: root
        group: root
        mode: "0755"
        force: false
      notify: Restart the libvirt QEMU daemon

    - name: Update the tap link speed hook
      ansible.builtin.copy:
        src: seapath-tap-link-speed
        dest: /etc/libvirt/hooks/qemu.d/20-seapath-tap-link-speed
        owner: root
        group: root
        mode: "0755"

- name: Remove the tap link speed hook
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/libvirt/hooks/qemu.d/20-seapath-tap-link-speed
    - /etc/seapath/tap-link-speed.conf
  when: configure_libvirt_tap_link_speed | int == 0
