---
- name: Converge
  hosts: all
  gather_facts: false
  tasks:
    - name: Rename or remove the account of the image
      ansible.builtin.include_role:
        name: configure_seapath_distro
        tasks_from: remove_old_admin.yml

    - name: Configure the admin user
      ansible.builtin.include_role:
        name: configure_seapath_distro
        tasks_from: users.yml
