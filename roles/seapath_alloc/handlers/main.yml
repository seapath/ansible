---
- name: Restart seapath-alloc-export timer
  ansible.builtin.systemd:
    name: seapath-alloc-export.timer
    state: restarted
    daemon_reload: true

# libvirt only discovers hook scripts when its QEMU daemon starts: virtqemud
# on OracleLinux (modular daemons), libvirtd elsewhere. Only the running ones
# need a restart; a socket-activated daemon that is not running will load the
# hook when it starts.
- name: Restart the libvirt QEMU daemon
  ansible.builtin.shell: |
    set -e
    for unit in virtqemud libvirtd; do
      if systemctl is-active --quiet "$unit.service"; then
        systemctl restart "$unit.service"
      fi
    done
  changed_when: true
