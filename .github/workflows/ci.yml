name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - 'inventories/**'
  workflow_dispatch:

permissions:
  checks: write
  contents: read

# One run per PR: a new push cancels the run still going on the previous
# head. Force-pushing a stack of PRs moves both the base and the head of
# each PR and sends two synchronize events for the same commit; without
# this, both runs would hold the integration benches one after the other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-qa:
    uses: ./.github/workflows/ci-qa.yml

  ci-unit:
    needs: ci-qa
    uses: ./.github/workflows/ci-unit.yml

  ci-molecule:
    needs: ci-unit
    uses: ./.github/workflows/ci-molecule.yml

  ci-debian:
    needs: ci-molecule
    uses: ./.github/workflows/ci-debian.yml

  ci-sles:
    needs: ci-molecule
    uses: ./.github/workflows/ci-sles.yml

  ci-oraclelinux:
    needs: ci-molecule
    uses: ./.github/workflows/ci-oraclelinux.yml

  ci-yocto:
    needs: ci-molecule
    uses: ./.github/workflows/ci-yocto.yml

  ci-virtual-cluster:
    needs: ci-molecule
    uses: ./.github/workflows/ci-virtual-cluster.yml
