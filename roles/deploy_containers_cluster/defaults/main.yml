---
# The workloads, keyed by name. The inventory declares them as
# `cluster_containers`: see the README for the fields.
deploy_containers_cluster_containers: "{{ cluster_containers | default({}) }}"

# Where the image archives are kept on every node, so that a changed archive
# is loaded again and an unchanged one is not.
deploy_containers_cluster_archive_dir: /var/lib/seapath/containers

# Where each node records the quadlets it wrote for each workload, so that a
# quadlet a new version renames or drops is removed.
deploy_containers_cluster_written_dir: /var/lib/seapath/containers/quadlets

# Where every node keeps the configuration of each workload, rendered from its
# `config` files: <dir>/<name>/, which the quadlets mount read only.
deploy_containers_cluster_config_dir: /etc/seapath-containers

# How many snapshots of its RBD image a workload keeps, one taken each time
# its images change, and how many RBD images put aside by a recreation.
deploy_containers_cluster_snapshots_kept: 3

# Whether a configuration file that does not match the site values (the
# `checks` of a workload) stops the run, or only warns.
deploy_containers_cluster_checks_fatal: false

# Workloads this run is limited to: the others are left as they are, neither
# deployed nor removed, and the run is as long as the ones it names. Given to
# one run (-e), never written in the inventory, where it would keep every run
# from the other workloads. A name or a list of names, every workload when
# empty.
deploy_containers_cluster_only: []

# Workloads this run starts again from nothing: the resource is deleted and the
# RBD image put aside, then both are created as on a first deployment. Given to
# one run (-e), never written in the inventory, since every run would then put
# aside what the workload wrote. A name or a list of names.
deploy_containers_cluster_recreate: []

# Workloads this run restarts once deployed, so that their new images,
# quadlets, configuration and site values apply now. Given to one run (-e),
# never written in the inventory: a running workload is otherwise never
# restarted, which on a substation is the operator's decision. A name or a
# list of names.
deploy_containers_cluster_restart: []

# Pacemaker operations, unless the workload sets its own. The start timeout
# covers seapath-rbd-mount waiting up to 300 s for Ceph at cluster boot.
deploy_containers_cluster_monitor_interval: 10s
deploy_containers_cluster_monitor_timeout: 100s
deploy_containers_cluster_start_timeout: 360s
deploy_containers_cluster_stop_timeout: 100s
