---
- name: "Get the images of {{ _name }}"
  ansible.builtin.include_tasks: node_image.yml
  loop: "{{ container.images | default([]) }}"
  loop_control:
    loop_var: _image
    label: "{{ _image.name }}"

# A quadlet with [Install] would start at boot on every node, behind
# Pacemaker's back.
- name: "Check that Pacemaker alone starts the quadlets of {{ _name }}"
  ansible.builtin.assert:
    that: _content is not search('^\s*\[Install\]', multiline=true)
    fail_msg: >-
      {{ _name }}: {{ _quadlet }} has an [Install] section. Pacemaker starts
      the workload on one node: remove it.
    quiet: true
  loop: "{{ container.quadlets }}"
  loop_control:
    loop_var: _quadlet
  vars:
    _content: "{{ lookup('ansible.builtin.template' if _quadlet.endswith('.j2') else 'ansible.builtin.file', _quadlet) }}"

# A pod whose containers are replaced one at a time may be left with none for
# a moment: quadlet would have it stop with its last container.
- name: "Write the quadlets of {{ _name }}"
  ansible.builtin.copy:
    content: "{{ (_lasting if _replaced else _content).rstrip() ~ '\n' }}"
    dest: "/etc/containers/systemd/{{ _quadlet | basename | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ container.quadlets }}"
  loop_control:
    loop_var: _quadlet
  vars:
    _file: "{{ _quadlet | basename | regex_replace('\\.j2$', '') }}"
    _replaced: "{{ _file.endswith('.pod') and container.update_steps | default([]) | length > 0 }}"
    _lasting: "{{ _content | regex_replace('(?m)^\\[Pod\\][ \\t]*$', '[Pod]\nPodmanArgs=--exit-policy=continue') }}"
    _content: "{{ lookup('ansible.builtin.template' if _quadlet.endswith('.j2') else 'ansible.builtin.file', _quadlet) }}"
  register: deploy_containers_cluster_quadlets
  notify: Reload systemd

# A container handed over is a container of the pod, on a network of the pod.
# Its stand-in keeps its service while the workload is updated: the same
# container out of the pod, in a network namespace of its own, so with the
# same interface, the same MAC and the same command line, on the same network
# under a second name and a port of its own. It depends on nothing of the
# workload but its RBD image, so that the workload can be restarted under it,
# and runs during an update only (update.yml).
- name: "Read where the containers handed over send for {{ _name }}"
  ansible.builtin.assert:
    that:
      - _pod | length == 1
      - _options | length == 1
    fail_msg: >-
      {{ _name }}: {{ _step.handover }} must be a container of a pod of the
      workload (Pod=), and that pod must name {{ _step.network }}
      (Network=).
    quiet: true
  loop: "{{ _handovers }}"
  loop_control:
    loop_var: _step
    label: "{{ _step.handover }}"
  vars: &handover_sources
    _slot: "{{ deploy_containers_cluster_slot }}"
    _source: "{{ container.quadlets | select('match', '(.*/)?' ~ (_step.handover | regex_escape) ~ '(\\.j2)?$') | first }}"
    _content: "{{ lookup('ansible.builtin.template' if _source.endswith('.j2') else 'ansible.builtin.file', _source) }}"
    _pod: "{{ _content | regex_search('(?m)^Pod=(.+?)[ \\t]*$', '\\1') or [] }}"
    _pod_source: "{{ container.quadlets | select('match', '(.*/)?' ~ (_pod | first | default('none') | regex_escape) ~ '(\\.j2)?$') | first | default('') }}"
    _pod_content: "{{ lookup('ansible.builtin.template' if _pod_source.endswith('.j2') else 'ansible.builtin.file', _pod_source) if _pod_source else '' }}"
    _options: "{{ _pod_content | regex_search('(?m)^Network=' ~ (_step.network | regex_escape) ~ '(.*?)[ \\t]*$', '\\1') or [] }}"

- name: "Write the second slots of {{ _name }}"
  ansible.builtin.copy:
    content: >
      {{ _mounted ~ (_content
         | regex_replace('(?m)^Pod=.*$', 'Network=' ~ _slot.network_b ~ (_options | first))
         | regex_replace('(?m)^(ContainerName=.*?)[ \t]*$', '\1-b')).rstrip() ~ _guarded }}
    dest: "/etc/containers/systemd/{{ _slot.container_b }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _handovers }}"
  loop_control:
    loop_var: _step
    label: "{{ _step.handover }}"
  vars:
    <<: *handover_sources
    # Its port is closed once made and before the container starts.
    _guarded: "\n\n[Service]\nExecStartPre=/usr/local/bin/seapath-container-handover guard {{ _name }}.{{ container.update_steps.index(_step) }} {{ container[_step.bridge] }} {{ _slot.port_b }}\n"
  register: deploy_containers_cluster_slots
  notify: Reload systemd

- name: "Write the networks of the second slots of {{ _name }}"
  ansible.builtin.copy:
    content: >
      {{ (_content
         | regex_replace('(?<![\w.-])' ~ (_network | regex_escape) ~ '(?![\w-])', _network ~ '-b')
         | regex_replace('(?<![\w.-])' ~ (container[_step.port] | regex_escape) ~ '(?![\w-])', container[_step.port] ~ 'b')).rstrip() }}
    dest: "/etc/containers/systemd/{{ deploy_containers_cluster_slot.network_b }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _handovers }}"
  loop_control:
    loop_var: _step
    label: "{{ _step.network }}"
  vars:
    _source: "{{ container.quadlets | select('match', '(.*/)?' ~ (_step.network | regex_escape) ~ '(\\.j2)?$') | first }}"
    _content: "{{ lookup('ansible.builtin.template' if _source.endswith('.j2') else 'ansible.builtin.file', _source) }}"
    _network: "{{ _step.network | regex_replace('\\.network$', '') }}"
  register: deploy_containers_cluster_slot_networks
  notify: Reload systemd

# A quadlet a new version renames or drops is removed. Only what the role wrote
# for this workload is: a file name alone cannot tell the quadlets of `web`
# from those of a workload called `web-lb`.
- name: "Read the quadlets the last run wrote for {{ _name }}"
  ansible.builtin.slurp:
    path: "{{ deploy_containers_cluster_written_dir }}/{{ _name }}"
  register: deploy_containers_cluster_written
  failed_when: false

- name: "Remove the quadlets no longer declared for {{ _name }}"
  ansible.builtin.file:
    path: "/etc/containers/systemd/{{ _stale }}"
    state: absent
  loop: >-
    {{ (deploy_containers_cluster_written.content | default('') | b64decode).splitlines()
       | select | reject('search', '/') | difference(_written) }}
  loop_control:
    loop_var: _stale
  vars:
    _written: "{{ (container.quadlets | map('basename') | map('regex_replace', '\\.j2$', '') | list) + _second_slots }}"
  notify: Reload systemd

- name: "Record the quadlets written for {{ _name }}"
  ansible.builtin.copy:
    content: "{{ _written | join('\n') ~ '\n' }}"
    dest: "{{ deploy_containers_cluster_written_dir }}/{{ _name }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    _written: "{{ (container.quadlets | map('basename') | map('regex_replace', '\\.j2$', '') | list) + _second_slots }}"

- name: "Create the drop-in directory of {{ _unit }}"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ _unit }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: container.rbd is defined or container.update_steps | default([]) | length > 0

- name: "Mount the RBD image when this unit starts: {{ _unit }}"
  ansible.builtin.copy:
    content: |
      # Managed by the deploy_containers_cluster role.
      [Unit]
      Requires=seapath-rbd@{{ _name }}.service
      After=seapath-rbd@{{ _name }}.service
    dest: "/etc/systemd/system/{{ _unit }}.d/seapath-rbd.conf"
    owner: root
    group: root
    mode: "0644"
  when: container.rbd is defined
  register: deploy_containers_cluster_dropin
  notify: Reload systemd

- name: "Detach from any RBD image the unit {{ _unit }}"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ _unit }}.d/seapath-rbd.conf"
    state: absent
  when: container.rbd is not defined
  notify: Reload systemd

# As it starts, the unit of the workload sets the gate of each container
# handed over: its port, just made, is closed while the stand-in is heard and
# open otherwise, whatever a previous run on this node left. The rules go
# with the workload, so that none outlives the port it named.
#
# The unit also notes the quadlets it starts from that no step replaces: the
# pod, its networks, the containers without a step. An update restarts the
# containers alone while the delivery left those as they are, and the whole
# workload once it changed one (update.yml).
- name: "Set what an update needs with this unit: {{ _unit }}"
  ansible.builtin.copy:
    content: |
      # Managed by the deploy_containers_cluster role.
      [Service]
      {% for _step in container.update_steps | default([]) %}
      {% if _step.handover is defined %}
      ExecStartPre=/usr/local/bin/seapath-container-handover reset {{ _name }}.{{ loop.index0 }} {{ container[_step.bridge] }} {{ container[_step.port] }} {{ _step.handover | regex_replace('\.container$', '-b.service') }}
      ExecStopPost=-/usr/local/bin/seapath-container-handover clear {{ _name }}.{{ loop.index0 }} {{ container[_step.bridge] }}
      {% endif %}
      {% endfor %}
      ExecStartPost=/bin/sh -c 'mkdir -p {{ deploy_containers_cluster_started_dir }} && sha256sum "$@" > {{ deploy_containers_cluster_started_dir }}/{{ _name }}' sh {{ _fixed | join(' ') }}
      ExecStopPost=-/usr/bin/rm -f {{ deploy_containers_cluster_started_dir }}/{{ _name }}
    dest: "/etc/systemd/system/{{ _unit }}.d/seapath-handover.conf"
    owner: root
    group: root
    mode: "0644"
  when: container.update_steps | default([]) | length > 0
  register: deploy_containers_cluster_gates
  notify: Reload systemd

- name: "Remove what an update needs from the unit {{ _unit }}"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ _unit }}.d/seapath-handover.conf"
    state: absent
  when: container.update_steps | default([]) | length == 0
  notify: Reload systemd

# The configuration of the site, on every node, where the quadlets mount it
# read only: the node Pacemaker starts the workload on already has it. The
# directory holds what the entry lists and nothing else.
- name: "Create the configuration directory of {{ _name }}"
  ansible.builtin.file:
    path: "{{ _config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: container.config | default([]) | length > 0

- name: "Write the configuration templates of {{ _name }}"
  ansible.builtin.template:
    src: "{{ _file }}"
    dest: "{{ _config_dir }}/{{ _file | basename | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ container.config | default([]) | select('match', '.*\\.j2$') | list }}"
  loop_control:
    loop_var: _file
  register: deploy_containers_cluster_config_templates

- name: "Copy the configuration files of {{ _name }}"
  ansible.builtin.copy:
    src: "{{ _file }}"
    dest: "{{ _config_dir }}/{{ _file | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ container.config | default([]) | reject('match', '.*\\.j2$') | list }}"
  loop_control:
    loop_var: _file
  register: deploy_containers_cluster_config_files

- name: "List the configuration on the node of {{ _name }}"
  ansible.builtin.find:
    paths: "{{ _config_dir }}"
    file_type: any
    hidden: true
  register: deploy_containers_cluster_config_found

- name: "Remove the configuration files no longer listed for {{ _name }}"
  ansible.builtin.file:
    path: "{{ _found.path }}"
    state: absent
  loop: "{{ deploy_containers_cluster_config_found.files }}"
  loop_control:
    loop_var: _found
    label: "{{ _found.path | basename }}"
  when: _found.path | basename not in _config_names
  register: deploy_containers_cluster_config_stale

- name: "Remove the configuration directory of {{ _name }}"
  ansible.builtin.file:
    path: "{{ _config_dir }}"
    state: absent
  when: container.config | default([]) | length == 0
  register: deploy_containers_cluster_config_dir_removed

# A running workload is never restarted: on a substation that is for the
# operator to decide.
- name: "Tell how the changes apply to {{ _name }}"
  ansible.builtin.debug:
    msg: >-
      {{ _name }} changed on this node. It applies when Pacemaker next starts
      the workload here; if it runs here now: crm resource restart {{ _name }}
  when: >-
    deploy_containers_cluster_quadlets is changed
    or deploy_containers_cluster_dropin is changed
    or deploy_containers_cluster_gates is changed
    or deploy_containers_cluster_slots is changed
    or deploy_containers_cluster_slot_networks is changed
    or deploy_containers_cluster_config_templates is changed
    or deploy_containers_cluster_config_files is changed
    or deploy_containers_cluster_config_stale is changed
    or deploy_containers_cluster_config_dir_removed is changed
