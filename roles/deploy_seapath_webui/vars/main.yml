---
# How `deploy_seapath_webui_http_proxy` is handed on, written once for the pull and
# for the container. Lower case because podman and Python both read it, and
# Python prefers it when both cases are set.
deploy_seapath_webui_proxy_environment:
  http_proxy: "{{ deploy_seapath_webui_http_proxy }}"
  https_proxy: "{{ deploy_seapath_webui_http_proxy }}"
  no_proxy: "{{ deploy_seapath_webui_no_proxy }}"
