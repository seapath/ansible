---
- name: Verify the OpenTelemetry collector deployment
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Read the generated collector configuration
      ansible.builtin.slurp:
        path: /etc/otelcol/config.yaml
      register: deploy_otel_collector_config_raw

    # Parsed rather than grepped: an indentation mistake in the template
    # produces a file that still contains every expected string and that the
    # collector refuses to start on.
    - name: Parse the generated collector configuration
      ansible.builtin.set_fact:
        deploy_otel_collector_config: >-
          {{ deploy_otel_collector_config_raw.content | b64decode | from_yaml }}

    - name: Name the scrape configs it holds
      ansible.builtin.set_fact:
        deploy_otel_collector_scrape_configs: >-
          {{ deploy_otel_collector_config.receivers.prometheus.config.scrape_configs }}

    - name: Assert every local endpoint is scraped on the loopback
      ansible.builtin.assert:
        that:
          - deploy_otel_collector_scrape_configs | map(attribute='job_name') | sort
            == ['ceph', 'ha', 'node', 'otelcol']
          - deploy_otel_collector_scrape_configs
            | map(attribute='static_configs') | flatten
            | map(attribute='targets') | flatten | sort
            == ['127.0.0.1:8888', '127.0.0.1:9100', '127.0.0.1:9283', '127.0.0.1:9664']
        fail_msg: >-
          The scrape configuration does not match the exporters of this host,
          or a target is not on the loopback

    - name: Assert the cluster and nodename labels are carried by every target
      ansible.builtin.assert:
        that:
          - deploy_otel_collector_scrape_configs
            | map(attribute='static_configs') | flatten
            | map(attribute='labels') | selectattr('cluster', 'eq', 'test-cluster')
            | list | length == 4
          - deploy_otel_collector_scrape_configs
            | map(attribute='static_configs') | flatten
            | map(attribute='labels') | selectattr('nodename', 'eq', 'collector')
            | list | length == 4
        fail_msg: cluster and nodename must be attached to every target

    - name: Assert the instance label is rewritten to the administration address
      ansible.builtin.assert:
        that:
          - deploy_otel_collector_scrape_configs
            | map(attribute='relabel_configs') | flatten
            | map(attribute='replacement') | sort
            == ['10.10.10.10:8888', '10.10.10.10:9100', '10.10.10.10:9283', '10.10.10.10:9664']
        fail_msg: >-
          Without this rewrite every node reports the same instance, since
          every target is scraped on 127.0.0.1

    - name: Assert the single endpoint is served with mutual TLS
      ansible.builtin.assert:
        that:
          - deploy_otel_collector_config.exporters.prometheus.endpoint == '10.10.10.10:9464'
          - deploy_otel_collector_config.exporters.prometheus.tls.cert_file
            == '/etc/otelcol/cert.d/servercert.pem'
          - deploy_otel_collector_config.exporters.prometheus.tls.key_file
            == '/etc/otelcol/cert.d/serverkey.pem'
          - deploy_otel_collector_config.exporters.prometheus.tls.client_ca_file
            == '/etc/otelcol/cert.d/clientca.pem'
          - deploy_otel_collector_config.exporters.prometheus.tls.min_version == '1.2'
          - deploy_otel_collector_config.exporters.prometheus.translation_strategy
            == 'NoTranslation'
        fail_msg: The exposed endpoint is not the expected TLS endpoint

    - name: Assert the collector bounds its own memory
      ansible.builtin.assert:
        that:
          - deploy_otel_collector_config.service.pipelines.metrics.processors
            == ['memory_limiter']
          - deploy_otel_collector_config.processors.memory_limiter.limit_mib == 256

    - name: Check the TLS material of the collector
      ansible.builtin.stat:
        path: "/etc/otelcol/cert.d/{{ item }}"
      register: deploy_otel_collector_tls_files
      loop:
        - servercert.pem
        - serverkey.pem
        - clientca.pem

    - name: Assert the private key is readable by root only
      ansible.builtin.assert:
        that:
          - deploy_otel_collector_tls_files.results | map(attribute='stat.exists') | min
          - >-
            (deploy_otel_collector_tls_files.results
             | selectattr('item', 'eq', 'serverkey.pem')
             | first).stat.mode == '0600'
        fail_msg: The TLS material is missing, or the private key is world readable

    - name: Read the collector quadlet unit
      ansible.builtin.slurp:
        path: /etc/containers/systemd/otelcol.container
      register: deploy_otel_collector_unit_raw

    - name: Assert the unit runs in the host network namespace
      ansible.builtin.assert:
        that:
          - "'Network=host' in (deploy_otel_collector_unit_raw.content | b64decode)"
          # The collector reads a key that belongs to root, and the image runs
          # as uid 10001: without this it starts, fails to load its own
          # certificate and restarts forever.
          - "'User=0:0' in (deploy_otel_collector_unit_raw.content | b64decode)"
          - "'Restart=always' in (deploy_otel_collector_unit_raw.content | b64decode)"
          - >-
            'opentelemetry-collector-contrib:0.161.0'
            in (deploy_otel_collector_unit_raw.content | b64decode)
        fail_msg: >-
          The collector must share the host network namespace, or it cannot
          reach the exporters on 127.0.0.1

    - name: Check the cukinia drop-in
      ansible.builtin.slurp:
        path: /etc/cukinia/extra-essential-services.d/deploy_otel_collector
      register: deploy_otel_collector_cukinia

    - name: Assert the collector is published as an essential service
      ansible.builtin.assert:
        that:
          - "'otelcol' in (deploy_otel_collector_cukinia.content | b64decode)"
