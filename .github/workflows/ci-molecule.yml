name: Molecule

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  molecule-role:
    name: Molecule Role Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Upgrade crun
        # Ubuntu ships crun < 1.14.3, which rejects the OCI Runtime Spec
        # v1.2.1 configs generated by current podman/buildah, failing every
        # container build with "crun: unknown version specified"
        # (see containers/podman#27272, fixed upstream in crun 1.14.3).
        env:
          CRUN_VERSION: "1.17"
          CRUN_GPG_FINGERPRINT: "AF60FCA3CDAA6DEAD157EA3A67E38F7A8BA21772"
        run: |
          curl -fsSLO "https://github.com/containers/crun/releases/download/${CRUN_VERSION}/crun-${CRUN_VERSION}-linux-amd64"
          curl -fsSLO "https://github.com/containers/crun/releases/download/${CRUN_VERSION}/crun-${CRUN_VERSION}-linux-amd64.asc"
          gpg --keyserver keys.openpgp.org --recv-keys "${CRUN_GPG_FINGERPRINT}"
          gpg --verify "crun-${CRUN_VERSION}-linux-amd64.asc" "crun-${CRUN_VERSION}-linux-amd64"
          sudo install -m 755 "crun-${CRUN_VERSION}-linux-amd64" /usr/bin/crun
          crun --version

      - name: Install Python dependencies
        run: pip install -r molecule_requirements.txt

      - name: Run Molecule Roles tests
        run: bash scripts/run-molecule-roles.sh

  molecule-playbooks:
    name: Molecule Playbook Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Upgrade crun
        # Ubuntu ships crun < 1.14.3, which rejects the OCI Runtime Spec
        # v1.2.1 configs generated by current podman/buildah, failing every
        # container build with "crun: unknown version specified"
        # (see containers/podman#27272, fixed upstream in crun 1.14.3).
        env:
          CRUN_VERSION: "1.17"
          CRUN_GPG_FINGERPRINT: "AF60FCA3CDAA6DEAD157EA3A67E38F7A8BA21772"
        run: |
          curl -fsSLO "https://github.com/containers/crun/releases/download/${CRUN_VERSION}/crun-${CRUN_VERSION}-linux-amd64"
          curl -fsSLO "https://github.com/containers/crun/releases/download/${CRUN_VERSION}/crun-${CRUN_VERSION}-linux-amd64.asc"
          gpg --keyserver keys.openpgp.org --recv-keys "${CRUN_GPG_FINGERPRINT}"
          gpg --verify "crun-${CRUN_VERSION}-linux-amd64.asc" "crun-${CRUN_VERSION}-linux-amd64"
          sudo install -m 755 "crun-${CRUN_VERSION}-linux-amd64" /usr/bin/crun
          crun --version

      - name: Install Python dependencies
        run: pip install -r molecule_requirements.txt

      - name: Run Molecule Playbook tests
        working-directory: playbooks
        run: molecule test --all
