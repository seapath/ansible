---
# Handlers run in declaration order, not in notification order: the daemon
# reload must stay first so that the restart acts on the regenerated unit.
- name: Reload systemd after the proxy unit changed
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart the metrics proxy
  ansible.builtin.systemd:
    name: "{{ deploy_metrics_proxy_service }}"
    state: restarted
  when: deploy_metrics_proxy_manage_services | bool
