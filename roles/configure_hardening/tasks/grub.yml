---
- name: Assert that a real grub password hash is provided
  ansible.builtin.assert:
    that:
      - grub_password is defined
      - grub_password is match('^grub\.pbkdf2\.sha512\.[0-9]+\.[0-9A-Fa-f]+\.[0-9A-Fa-f]+$')
    fail_msg: >-
      grub_password is not defined or is not a valid PBKDF2 hash (the example
      inventory placeholder is not accepted). Generate one with
      grub-mkpasswd-pbkdf2 -c 65536 and set grub_password.
    quiet: true
  when: not revert
- name: Set grub password
  ansible.builtin.template:
    src: "01_password.j2"
    dest: /etc/grub.d/01_password
    group: "root"
    owner: "root"
    mode: "0755"
  notify: Update grub
  when: not revert
- name: Unset grub password
  ansible.builtin.file:
    state: absent
    path: /etc/grub.d/01_password
  notify: Update grub
  when: revert

- name: Add unrestricted in grub.cfg
  ansible.builtin.lineinfile:
    # CLASS="--class gnu-linux --class gnu --class os --unrestricted"
    path: /etc/grub.d/10_linux
    regexp: "^CLASS="
    line: 'CLASS="--class gnu-linux --class gnu --class os --unrestricted"'
  notify: Update grub
  when: not revert
- name: Remove unrestricted in grub.cfg
  ansible.builtin.lineinfile:
    # CLASS="--class gnu-linux --class gnu --class os"
    path: /etc/grub.d/10_linux
    regexp: "^CLASS="
    line: 'CLASS="--class gnu-linux --class gnu --class os"'
  notify: Update grub
  when: revert
