---
# The RBD image is filled once, when it is created: nothing can have it
# mounted then, and a redeployment never overwrites what the workload wrote
# there since. rbd info exits 2 when the image does not exist; any other
# failure (Ceph unreachable) must not be taken for a missing image.
- name: "Look for the RBD image of {{ _name }}"
  ansible.builtin.command:
    cmd: rbd info rbd/{{ _name }}
  register: deploy_containers_cluster_rbd_info
  changed_when: false
  failed_when: deploy_containers_cluster_rbd_info.rc not in [0, 2]
  when: container.rbd is defined

- name: "Create and fill the RBD image of {{ _name }}"
  when:
    - container.rbd is defined
    - deploy_containers_cluster_rbd_info.rc == 2
  vars:
    _mountpoint: "/mnt/rbd/{{ _name }}"
  block:
    - name: "Create and mount the RBD image of {{ _name }}"
      ansible.builtin.command:
        cmd: seapath-rbd-mount {{ _name }} {{ container.rbd.size }}
      changed_when: true

    - name: "Create the directories of the files of {{ _name }}"
      ansible.builtin.file:
        path: "{{ (_mountpoint ~ '/' ~ _file.dest) | dirname }}"
        state: directory
        owner: "{{ _file.owner | default('root') }}"
        group: "{{ _file.group | default('root') }}"
        mode: "0755"
      loop: "{{ container.rbd.files | default([]) }}"
      loop_control:
        loop_var: _file
        label: "{{ _file.dest }}"

    - name: "Copy to the RBD image the files of {{ _name }}"
      ansible.builtin.copy:
        src: "{{ _file.src }}"
        dest: "{{ _mountpoint }}/{{ _file.dest }}"
        owner: "{{ _file.owner | default('root') }}"
        group: "{{ _file.group | default('root') }}"
        mode: "{{ _file.mode | default('0644') }}"
      loop: "{{ container.rbd.files | default([]) }}"
      loop_control:
        loop_var: _file
        label: "{{ _file.dest }}"

    - name: "Unmount the RBD image of {{ _name }}"
      ansible.builtin.command:
        cmd: seapath-rbd-unmount {{ _name }}
      changed_when: true

  # A half-filled image would be taken for a filled one on the next run.
  rescue:
    - name: "Unmount after the failure the RBD image of {{ _name }}"
      ansible.builtin.command:
        cmd: seapath-rbd-unmount {{ _name }}
      changed_when: true

    - name: "Remove after the failure the RBD image of {{ _name }}"
      ansible.builtin.command:
        cmd: rbd rm rbd/{{ _name }}
      changed_when: true

    - name: "Report the failure to fill the RBD image of {{ _name }}"
      ansible.builtin.fail:
        msg: >-
          {{ _name }}: filling the RBD image failed on
          {{ ansible_failed_task.name }}: {{ ansible_failed_result.msg | default(ansible_failed_result) }}.
          The image was removed, run the playbook again once fixed.

# The images the workload was last deployed with are kept in the metadata of
# its RBD image. When they change, a snapshot keeps the state the workload
# wrote with the version it leaves, before the new one reads or migrates it.
# The workload runs meanwhile: the snapshot is what a power cut would leave,
# which an application that writes its state atomically reads back.
- name: "Snapshot before its images change the state of {{ _name }}"
  when: container.rbd is defined
  vars:
    _images: "{{ container.images | default([]) | map(attribute='name') | join(' ') }}"
  block:
    - name: "Read the images deployed for {{ _name }}"
      ansible.builtin.command:
        cmd: rbd image-meta list rbd/{{ _name }} --format json
      register: deploy_containers_cluster_rbd_meta
      changed_when: false

    - name: "Snapshot the RBD image of {{ _name }}"
      ansible.builtin.command:
        cmd: rbd snap create rbd/{{ _name }}@{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}-{{ _left | regex_replace('[^A-Za-z0-9_.-]', '_') }}
      vars:
        _deployed: "{{ ((deploy_containers_cluster_rbd_meta.stdout | trim or '{}') | from_json)['seapath.images'] | default('') }}"
        _left: "{{ (_deployed.split(' ') | first).split(':') | last }}"
      when:
        - _deployed | length > 0
        - _deployed != _images
      changed_when: true

    - name: "Record the images deployed for {{ _name }}"
      ansible.builtin.command:
        cmd: rbd image-meta set rbd/{{ _name }} seapath.images "{{ _images }}"
      when: ((deploy_containers_cluster_rbd_meta.stdout | trim or '{}') | from_json)['seapath.images'] | default('') != _images
      changed_when: true

    - name: "List the snapshots of {{ _name }}"
      ansible.builtin.command:
        cmd: rbd snap ls rbd/{{ _name }} --format json
      register: deploy_containers_cluster_rbd_snaps
      changed_when: false

    # Only the snapshots this role took: an operator's own stay.
    - name: "Remove the oldest snapshots of {{ _name }}"
      ansible.builtin.command:
        cmd: rbd snap rm rbd/{{ _name }}@{{ _snap }}
      loop: "{{ _ours[: -(deploy_containers_cluster_snapshots_kept | int)] if deploy_containers_cluster_snapshots_kept | int > 0 else _ours }}"
      loop_control:
        loop_var: _snap
      vars:
        _ours: >-
          {{ (deploy_containers_cluster_rbd_snaps.stdout | trim or '[]') | from_json | map(attribute='name')
             | select('match', '^[0-9]{8}T[0-9]{6}Z-') | sort | list }}
      changed_when: true

# The definition of the workload travels with its state, as a VM's XML and
# metadata travel with its disk: the entry as the inventory declares it, the
# files it names, and the whole folder a delivery installs it from,
# `inventories/<name>/` (DELIVERY.md), whose values.yaml, checks.yaml, README,
# examples and site files the entry does not all name. backup_restore exports
# every metadata key of the image and restores them, so a backup is enough to
# declare the workload again on a cluster that never had it. The image
# archives are left out: the backup saves the container images themselves.
- name: "Record the definition of {{ _name }}"
  when: container.rbd is defined
  vars:
    _base: "{{ playbook_dir }}"
    _named: >-
      {{ (container.quadlets | default([]))
         + (container.config | default([]))
         + (container.rbd.files | default([]) | map(attribute='src') | list) }}
    _archives: "{{ container.images | default([]) | selectattr('archive', 'defined') | map(attribute='archive') | map('basename') | list }}"
  block:
    - name: "Find the delivery folder of {{ _name }}"
      ansible.builtin.find:
        paths: "{{ _base }}/../inventories/{{ _name }}"
        recurse: true
        file_type: file
        hidden: true
        # Where a run stages the site's tree, the folder can be a symlink.
        follow: true
      delegate_to: localhost
      become: false
      register: deploy_containers_cluster_folder

    # Read on the Ansible machine, byte for byte: a site file is not always
    # text.
    - name: "Read the files of {{ _name }}"
      ansible.builtin.slurp:
        src: "{{ _source }}"
      loop: >-
        {{ ((_named | map('regex_replace', '^(?!/)', _base ~ '/') | list)
            + (deploy_containers_cluster_folder.files | map(attribute='path')
               | reject('search', '\.tar$')
               | reject('search', '/(' ~ (_archives | map('regex_escape') | join('|') or '$^') ~ ')$')
               | list))
           | unique | list }}
      loop_control:
        loop_var: _source
      delegate_to: localhost
      become: false
      register: deploy_containers_cluster_sources

    - name: "Write the definition of {{ _name }} on its RBD image"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/seapath-rbd-meta
          - rbd/{{ _name }}
          - seapath.definition
        stdin: "{{ _definition | to_json(sort_keys=true) }}"
        stdin_add_newline: false
      vars:
        _definition:
          format: 1
          name: "{{ _name }}"
          entry: "{{ container }}"
          # Keyed by the path as an entry gives it, from the playbook
          # directory: `../inventories/<name>/values.yaml`.
          files: >-
            {{ dict(deploy_containers_cluster_sources.results
                    | map(attribute='_source') | map('relpath', _base)
                    | zip(deploy_containers_cluster_sources.results | map(attribute='content'))) }}
      register: deploy_containers_cluster_definition
      changed_when: deploy_containers_cluster_definition.stdout == 'changed'

# Created once, like a VM: an existing resource keeps its operations and its
# colocations. Its placement follows the entry (below).
- name: "Look for the Pacemaker resource of {{ _name }}"
  ansible.builtin.command:
    cmd: crm configure show {{ _name }}
  register: deploy_containers_cluster_resource
  changed_when: false
  failed_when: false

- name: "Create the Pacemaker resource of {{ _name }}"
  ansible.builtin.command:
    cmd: crm configure load update -
    stdin: "{{ lookup('ansible.builtin.template', 'pacemaker.crm.j2') }}"
  when: deploy_containers_cluster_resource.rc != 0
  changed_when: true

- name: "Note that the run created the resource of {{ _name }}"
  ansible.builtin.set_fact:
    deploy_containers_cluster_created: "{{ deploy_containers_cluster_created | default([]) + [_name] }}"
  when: deploy_containers_cluster_resource.rc != 0

# The placement rules of an existing resource follow the entry: written again
# when it changed them, deleted when it no longer has them. Pacemaker then moves
# a running workload to the node they name, which is a stop and a start.
- name: "Read the placement rules of {{ _name }}"
  ansible.builtin.command:
    cmd: crm configure show {{ _rule }}
  loop: "{{ deploy_containers_cluster_placement.keys() | list }}"
  loop_control:
    loop_var: _rule
  register: deploy_containers_cluster_rules
  changed_when: false
  failed_when: false
  when: deploy_containers_cluster_resource.rc == 0

- name: "Write the placement rules of {{ _name }}"
  ansible.builtin.command:
    cmd: crm configure load update -
    stdin: "{{ _wanted }}"
  loop: "{{ deploy_containers_cluster_rules.results | default([]) }}"
  loop_control:
    loop_var: _found
    label: "{{ _found._rule }}"
  when:
    - _found.rc is defined
    - _wanted | length > 0
    - _wanted != _shown
  vars:
    _wanted: "{{ deploy_containers_cluster_placement[_found._rule] }}"
    # crm folds a long line with a lone backslash.
    _shown: >-
      {{ (_found.stdout if _found.rc == 0 else '') | split
         | reject('match', '^[^a-zA-Z0-9]$') | join(' ') }}
  changed_when: true

- name: "Delete the placement rules the entry no longer has for {{ _name }}"
  ansible.builtin.command:
    cmd: crm configure delete {{ _found._rule }}
  loop: "{{ deploy_containers_cluster_rules.results | default([]) }}"
  loop_control:
    loop_var: _found
    label: "{{ _found._rule }}"
  when:
    - _found.rc is defined
    - _found.rc == 0
    - deploy_containers_cluster_placement[_found._rule] | length == 0
  changed_when: true
