---
stage_vm_disk_url_regex: '^(https?|ftps?)://'
stage_vm_disk_source_path: "{{ stage_vm_disk_source.path | default('') if stage_vm_disk_source is mapping else stage_vm_disk_source }}"
stage_vm_disk_resolved_source: "{{ stage_vm_disk_source_path if stage_vm_disk_source_path | length > 0 else stage_vm_disk_fallback_source }}"
stage_vm_disk_source_is_remote: "{{ stage_vm_disk_resolved_source is match(stage_vm_disk_url_regex) }}"
stage_vm_disk_source_file_name: "{{ (stage_vm_disk_resolved_source | urlsplit('path') if stage_vm_disk_source_is_remote else stage_vm_disk_resolved_source) | basename }}"
stage_vm_disk_checksum_preference: ['sha512', 'sha384', 'sha256']
stage_vm_disk_checksum: "{{ stage_vm_disk_source | dict2items | selectattr('key', 'in', stage_vm_disk_checksum_preference) | list | items2dict if stage_vm_disk_source is mapping else {} }}"
stage_vm_disk_checksum_algorithm: "{{ stage_vm_disk_checksum_preference | select('in', stage_vm_disk_checksum.keys() | list) | first | default('') }}"
stage_vm_disk_checksum_hash: "{{ stage_vm_disk_checksum[stage_vm_disk_checksum_algorithm] | default('') | string | trim | lower }}"
stage_vm_disk_checksum_present: "{{ (stage_vm_disk_checksum_algorithm | length > 0) and (stage_vm_disk_checksum_hash | length > 0) }}"
