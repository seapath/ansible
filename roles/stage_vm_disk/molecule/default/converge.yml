---
- name: Converge
  hosts: hv1
  gather_facts: false
  vars:
    # Message of the task that failed inside a rescue, including per-item messages of a looped task
    stage_vm_disk_test_failure_message: "{{ ((ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='msg') | list) + [ansible_failed_result.msg | default('')]) | join(' ') }}"
  tasks:
    - name: Create staging destination directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ stage_vm_disk_test_directory }}"
        - "{{ stage_vm_disk_test_remote_directory }}"

    - name: Stage disk from a local source
      ansible.builtin.include_role:
        name: stage_vm_disk
      vars:
        stage_vm_disk_label: vm-local
        stage_vm_disk_source:
          path: "{{ stage_vm_disk_test_local_disk }}"
          sha256: "{{ stage_vm_disk_test_sha256 }}"
        stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-local.qcow2"
        stage_vm_disk_remote_tmp: "{{ stage_vm_disk_test_remote_tmp_local }}"

    - name: Stage disk from a local source with an upper-case, padded checksum digest
      ansible.builtin.include_role:
        name: stage_vm_disk
      vars:
        stage_vm_disk_label: vm-upper-padded-checksum
        stage_vm_disk_source:
          path: "{{ stage_vm_disk_test_local_disk }}"
          sha256: " {{ stage_vm_disk_test_sha256 | upper }} "
        stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-upper-padded-checksum.qcow2"

    - name: Stage disk from a remote source
      ansible.builtin.include_role:
        name: stage_vm_disk
      vars:
        stage_vm_disk_label: vm-remote
        stage_vm_disk_source:
          path: "{{ stage_vm_disk_test_remote_disk }}"
          sha256: "{{ stage_vm_disk_test_sha256 }}"
        stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-remote.qcow2"
        stage_vm_disk_remote_tmp: "{{ stage_vm_disk_test_remote_tmp_remote }}"

    - name: Stage disk via the directory fallback source
      ansible.builtin.include_role:
        name: stage_vm_disk
      vars:
        stage_vm_disk_label: vm-fallback
        stage_vm_disk_fallback_source: "{{ stage_vm_disk_test_local_disk }}"
        stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-fallback.qcow2"

    - name: Stage disk from a plain path string with the destination derived from the destination directory
      ansible.builtin.include_role:
        name: stage_vm_disk
      vars:
        stage_vm_disk_label: vm-derived-destination
        stage_vm_disk_source: "{{ stage_vm_disk_test_local_disk }}"
        stage_vm_disk_destination_directory: "{{ stage_vm_disk_test_directory }}"

    - name: Stage disk from a signed-style URL with the destination derived from the URL path (query and fragment dropped)
      ansible.builtin.include_role:
        name: stage_vm_disk
      vars:
        stage_vm_disk_label: vm-derived-url
        stage_vm_disk_source:
          path: "{{ stage_vm_disk_test_remote_disk }}?token=xyz&expires=1#fragment"
          sha256: "{{ stage_vm_disk_test_sha256 }}"
        stage_vm_disk_destination_directory: "{{ stage_vm_disk_test_remote_directory }}"

    - name: Stage disk from a percent-encoded URL (encoding kept in the derived file name)
      ansible.builtin.include_role:
        name: stage_vm_disk
      vars:
        stage_vm_disk_label: vm-derived-url-encoded
        stage_vm_disk_source:
          path: "http://127.0.0.1:8080/guest%20copy.qcow2?token=abc"
          sha256: "{{ stage_vm_disk_test_sha256 }}"
        stage_vm_disk_destination_directory: "{{ stage_vm_disk_test_remote_directory }}"

    - name: Stage disk from a URL with an encoded path separator (must stay a flat file name, never a sub path)
      ansible.builtin.include_role:
        name: stage_vm_disk
      vars:
        stage_vm_disk_label: vm-derived-url-encoded-slash
        stage_vm_disk_source:
          path: "http://127.0.0.1:8080/images%2Fnested.qcow2"
          sha256: "{{ stage_vm_disk_test_sha256 }}"
        stage_vm_disk_destination_directory: "{{ stage_vm_disk_test_remote_directory }}"

    - name: Stage disk with a correct sha512 and a wrong sha256 dummy (strongest algorithm must win)
      ansible.builtin.include_role:
        name: stage_vm_disk
      vars:
        stage_vm_disk_label: vm-checksum-preference
        stage_vm_disk_source:
          path: "{{ stage_vm_disk_test_local_disk }}"
          sha512: "{{ stage_vm_disk_test_sha512 }}"
          sha256: "{{ stage_vm_disk_test_badsum }}"
        stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-checksum-preference.qcow2"

    - name: Attempt staging from a remote source with a wrong checksum
      block:
        - name: Stage disk for vm-remote-badsum
          ansible.builtin.include_role:
            name: stage_vm_disk
          vars:
            stage_vm_disk_label: vm-remote-badsum
            stage_vm_disk_source:
              path: "{{ stage_vm_disk_test_remote_disk }}"
              sha256: "{{ stage_vm_disk_test_badsum }}"
            stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-remote-badsum.qcow2"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_remote_badsum_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_remote_badsum_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt staging from a local source with a wrong checksum
      tags: molecule-idempotence-notest  # copies and removes the disk on every run by design
      block:
        - name: Stage disk for vm-local-badsum
          ansible.builtin.include_role:
            name: stage_vm_disk
          vars:
            stage_vm_disk_label: vm-local-badsum
            stage_vm_disk_source:
              path: "{{ stage_vm_disk_test_local_disk }}"
              sha256: "{{ stage_vm_disk_test_badsum }}"
            stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-local-badsum.qcow2"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_local_badsum_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_local_badsum_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt restaging over an existing, matching disk with a wrong checksum (local source)
      tags: molecule-idempotence-notest  # recreates and removes the disk on every run by design
      block:
        - name: Pre-stage vm-existing-local-badsum with the correct disk
          ansible.builtin.copy:
            src: "{{ stage_vm_disk_test_local_disk }}"
            dest: "{{ stage_vm_disk_test_directory }}/vm-existing-local-badsum.qcow2"
            mode: "0644"
        - name: Stage disk for vm-existing-local-badsum
          ansible.builtin.include_role:
            name: stage_vm_disk
          vars:
            stage_vm_disk_label: vm-existing-local-badsum
            stage_vm_disk_source:
              path: "{{ stage_vm_disk_test_local_disk }}"
              sha256: "{{ stage_vm_disk_test_badsum }}"
            stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-existing-local-badsum.qcow2"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_existing_local_badsum_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_existing_local_badsum_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt restaging over an existing, matching disk with a wrong checksum (remote source)
      tags: molecule-idempotence-notest  # recreates and removes the disk on every run by design
      block:
        - name: Pre-stage vm-existing-remote-badsum with the correct disk
          ansible.builtin.copy:
            src: "{{ stage_vm_disk_test_local_disk }}"
            dest: "{{ stage_vm_disk_test_directory }}/vm-existing-remote-badsum.qcow2"
            mode: "0644"
        - name: Stage disk for vm-existing-remote-badsum
          ansible.builtin.include_role:
            name: stage_vm_disk
          vars:
            stage_vm_disk_label: vm-existing-remote-badsum
            stage_vm_disk_source:
              path: "{{ stage_vm_disk_test_remote_disk }}"
              sha256: "{{ stage_vm_disk_test_badsum }}"
            stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-existing-remote-badsum.qcow2"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_existing_remote_badsum_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_existing_remote_badsum_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt staging with an unsupported checksum algorithm
      block:
        - name: Stage disk for vm-unsupported-algo
          ansible.builtin.include_role:
            name: stage_vm_disk
          vars:
            stage_vm_disk_label: vm-unsupported-algo
            stage_vm_disk_source:
              path: "{{ stage_vm_disk_test_local_disk }}"
              md5: "00000000000000000000000000000000"
            stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-unsupported-algo.qcow2"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_unsupported_algo_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_unsupported_algo_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt staging from a remote source without a checksum
      block:
        - name: Stage disk for vm-remote-nosum
          ansible.builtin.include_role:
            name: stage_vm_disk
          vars:
            stage_vm_disk_label: vm-remote-nosum
            stage_vm_disk_source: "{{ stage_vm_disk_test_remote_disk }}"
            stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-remote-nosum.qcow2"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_remote_nosum_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_remote_nosum_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt staging without any disk source
      block:
        - name: Stage disk for vm-no-source
          ansible.builtin.include_role:
            name: stage_vm_disk
          vars:
            stage_vm_disk_label: vm-no-source
            stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-no-source.qcow2"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_no_source_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_no_source_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt staging with a source entry that has an unsupported key
      block:
        - name: Stage disk for vm-invalid-entry
          ansible.builtin.include_role:
            name: stage_vm_disk
          vars:
            stage_vm_disk_label: vm-invalid-entry
            stage_vm_disk_source:
              url: "{{ stage_vm_disk_test_remote_disk }}"
              sha256: "{{ stage_vm_disk_test_sha256 }}"
            stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-invalid-entry.qcow2"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_invalid_source_entry_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_invalid_source_entry_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt staging with a source entry that is a list
      block:
        - name: Stage disk for vm-list-entry
          ansible.builtin.include_role:
            name: stage_vm_disk
          vars:
            stage_vm_disk_label: vm-list-entry
            stage_vm_disk_source:
              - "{{ stage_vm_disk_test_local_disk }}"
            stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-list-entry.qcow2"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_list_entry_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_list_entry_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt staging with a dict entry without a path
      block:
        - name: Stage disk for vm-entry-without-path
          ansible.builtin.include_role:
            name: stage_vm_disk
          vars:
            stage_vm_disk_label: vm-entry-without-path
            stage_vm_disk_source:
              sha256: "{{ stage_vm_disk_test_sha256 }}"
            stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-entry-without-path.qcow2"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_entry_without_path_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_entry_without_path_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt staging with an empty checksum digest
      block:
        - name: Stage disk for vm-empty-digest
          ansible.builtin.include_role:
            name: stage_vm_disk
          vars:
            stage_vm_disk_label: vm-empty-digest
            stage_vm_disk_source:
              path: "{{ stage_vm_disk_test_local_disk }}"
              sha256: ""
            stage_vm_disk_destination: "{{ stage_vm_disk_test_directory }}/vm-empty-digest.qcow2"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_empty_digest_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_empty_digest_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt staging without a destination
      block:
        - name: Stage disk for vm-no-destination
          ansible.builtin.include_role:
            name: stage_vm_disk
          vars:
            stage_vm_disk_label: vm-no-destination
            stage_vm_disk_source: "{{ stage_vm_disk_test_local_disk }}"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_no_destination_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_no_destination_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt staging from a URL without a file name in its path
      block:
        - name: Stage disk for vm-url-without-file
          ansible.builtin.include_role:
            name: stage_vm_disk
          vars:
            stage_vm_disk_label: vm-url-without-file
            stage_vm_disk_source:
              path: "http://127.0.0.1:8080/?token=xyz"
              sha256: "{{ stage_vm_disk_test_sha256 }}"
            stage_vm_disk_destination_directory: "{{ stage_vm_disk_test_remote_directory }}"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_url_without_file_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_url_without_file_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Normalize a mixed additional disk list
      ansible.builtin.include_role:
        name: stage_vm_disk
        tasks_from: normalize
      vars:
        stage_vm_disk_label: normalize-test
        stage_vm_disk_disks:
          - "../files/plain.qcow2"
          - path: "{{ stage_vm_disk_test_local_disk }}"
            sha256: "{{ stage_vm_disk_test_sha256 }}"
            label: "scada-data"
          - path: "{{ stage_vm_disk_test_remote_disk }}"
            sha256: "{{ stage_vm_disk_test_sha256 }}"
          - path: "{{ stage_vm_disk_test_remote_disk }}?token=xyz&expires=1#fragment"
            sha256: "{{ stage_vm_disk_test_sha256 }}"
          - path: "http://127.0.0.1:8080/guest%20copy.qcow2?token=abc"
            sha256: "{{ stage_vm_disk_test_sha256 }}"
          - "../files/odd?name.qcow2"
          - path: "http://127.0.0.1:8080/images%2F..%2Fguest.qcow2"
            sha256: "{{ stage_vm_disk_test_sha256 }}"

    - name: Assert normalized disk entries
      ansible.builtin.assert:
        that:
          - stage_vm_disk_normalized_disks | length == 7
          - stage_vm_disk_normalized_disks[0].file == 'plain.qcow2'
          - stage_vm_disk_normalized_disks[0].label == ''
          - stage_vm_disk_normalized_disks[0].local_source == '../files/plain.qcow2'
          - stage_vm_disk_normalized_disks[0].remote_source == ''
          - stage_vm_disk_normalized_disks[0].checksum == {}
          - stage_vm_disk_normalized_disks[1].label == 'scada-data'
          - stage_vm_disk_normalized_disks[1].local_source == stage_vm_disk_test_local_disk
          - stage_vm_disk_normalized_disks[1].remote_source == ''
          - stage_vm_disk_normalized_disks[1].checksum.sha256 == stage_vm_disk_test_sha256
          - stage_vm_disk_normalized_disks[2].file == 'guest.qcow2'
          - stage_vm_disk_normalized_disks[2].label == ''
          - stage_vm_disk_normalized_disks[2].local_source == ''
          - stage_vm_disk_normalized_disks[2].remote_source == stage_vm_disk_test_remote_disk
          - stage_vm_disk_normalized_disks[3].file == 'guest.qcow2'
          - stage_vm_disk_normalized_disks[3].remote_source == stage_vm_disk_test_remote_disk ~ '?token=xyz&expires=1#fragment'
          - stage_vm_disk_normalized_disks[4].file == 'guest%20copy.qcow2'
          - stage_vm_disk_normalized_disks[5].file == 'odd?name.qcow2'
          - stage_vm_disk_normalized_disks[5].local_source == '../files/odd?name.qcow2'
          - stage_vm_disk_normalized_disks[6].file == 'images%2F..%2Fguest.qcow2'
        fail_msg: "Normalization produced unexpected entries: {{ stage_vm_disk_normalized_disks }}"

    - name: Attempt normalizing an invalid disk entry
      block:
        - name: Normalize a dict entry with an unsupported key
          ansible.builtin.include_role:
            name: stage_vm_disk
            tasks_from: normalize
          vars:
            stage_vm_disk_label: normalize-invalid
            stage_vm_disk_disks:
              - url: "{{ stage_vm_disk_test_remote_disk }}"
                sha256: "{{ stage_vm_disk_test_sha256 }}"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_invalid_entry_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_invalid_entry_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt normalizing a disk entry with an invalid label
      block:
        - name: Normalize a dict entry with a label containing a path separator
          ansible.builtin.include_role:
            name: stage_vm_disk
            tasks_from: normalize
          vars:
            stage_vm_disk_label: normalize-invalid-label
            stage_vm_disk_disks:
              - path: "{{ stage_vm_disk_test_local_disk }}"
                sha256: "{{ stage_vm_disk_test_sha256 }}"
                label: "../escape"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_invalid_label_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_invalid_label_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt normalizing a remote disk entry without a checksum
      block:
        - name: Normalize a URL entry without checksum keys
          ansible.builtin.include_role:
            name: stage_vm_disk
            tasks_from: normalize
          vars:
            stage_vm_disk_label: normalize-remote-nosum
            stage_vm_disk_disks:
              - path: "{{ stage_vm_disk_test_remote_disk }}"
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_remote_nosum_entry_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_remote_nosum_entry_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Attempt normalizing a disk entry with an empty checksum digest
      block:
        - name: Normalize a dict entry whose sha256 is empty
          ansible.builtin.include_role:
            name: stage_vm_disk
            tasks_from: normalize
          vars:
            stage_vm_disk_label: normalize-empty-digest
            stage_vm_disk_disks:
              - path: "{{ stage_vm_disk_test_local_disk }}"
                sha256: ""
        - name: Record unexpected success
          ansible.builtin.set_fact:
            stage_vm_disk_test_empty_digest_entry_failure: ""
      rescue:
        - name: Record the failure message
          ansible.builtin.set_fact:
            stage_vm_disk_test_empty_digest_entry_failure: "{{ stage_vm_disk_test_failure_message }}"

    - name: Assert invalid disk source configurations were rejected for the expected reason
      tags: molecule-idempotence-notest  # depends on facts from the skipped attempt above
      ansible.builtin.assert:
        that:
          - "'did not match' in stage_vm_disk_test_remote_badsum_failure"
          - "'Checksum mismatch' in stage_vm_disk_test_local_badsum_failure"
          - "'Checksum mismatch' in stage_vm_disk_test_existing_local_badsum_failure"
          - "'did not match' in stage_vm_disk_test_existing_remote_badsum_failure"
          - "'Invalid disk source entry' in stage_vm_disk_test_unsupported_algo_failure"
          - "'A checksum is required' in stage_vm_disk_test_remote_nosum_failure"
          - "'No disk source' in stage_vm_disk_test_no_source_failure"
          - "'Invalid disk source entry' in stage_vm_disk_test_invalid_source_entry_failure"
          - "'Invalid disk source entry' in stage_vm_disk_test_list_entry_failure"
          - "'Invalid disk source entry' in stage_vm_disk_test_entry_without_path_failure"
          - "'non-empty hex digest' in stage_vm_disk_test_empty_digest_failure"
          - "'set stage_vm_disk_destination' in stage_vm_disk_test_no_destination_failure"
          - "'set stage_vm_disk_destination' in stage_vm_disk_test_url_without_file_failure"
          - "'Invalid disk entry' in stage_vm_disk_test_invalid_entry_failure"
          - "'Invalid disk entry' in stage_vm_disk_test_invalid_label_failure"
          - "'Invalid disk entry' in stage_vm_disk_test_remote_nosum_entry_failure"
          - "'Invalid disk entry' in stage_vm_disk_test_empty_digest_entry_failure"
        fail_msg: >-
          A rejected staging attempt succeeded or failed for another reason than expected.
          Recorded failure messages (empty = succeeded):
          remote badsum: '{{ stage_vm_disk_test_remote_badsum_failure }}';
          local badsum: '{{ stage_vm_disk_test_local_badsum_failure }}';
          existing disk, local badsum: '{{ stage_vm_disk_test_existing_local_badsum_failure }}';
          existing disk, remote badsum: '{{ stage_vm_disk_test_existing_remote_badsum_failure }}';
          unsupported algorithm: '{{ stage_vm_disk_test_unsupported_algo_failure }}';
          remote without checksum: '{{ stage_vm_disk_test_remote_nosum_failure }}';
          no source: '{{ stage_vm_disk_test_no_source_failure }}';
          unsupported key: '{{ stage_vm_disk_test_invalid_source_entry_failure }}';
          list entry: '{{ stage_vm_disk_test_list_entry_failure }}';
          dict without path: '{{ stage_vm_disk_test_entry_without_path_failure }}';
          empty digest: '{{ stage_vm_disk_test_empty_digest_failure }}';
          no destination: '{{ stage_vm_disk_test_no_destination_failure }}';
          URL without file name: '{{ stage_vm_disk_test_url_without_file_failure }}';
          invalid normalize entry: '{{ stage_vm_disk_test_invalid_entry_failure }}';
          invalid label: '{{ stage_vm_disk_test_invalid_label_failure }}';
          normalized remote entry without checksum: '{{ stage_vm_disk_test_remote_nosum_entry_failure }}';
          normalized entry with empty digest: '{{ stage_vm_disk_test_empty_digest_entry_failure }}'.
