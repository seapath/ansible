---
- name: Deploy prometheus exporters
  hosts:
    - cluster_machines
    - standalone_machine
  become: true
  roles:
    - detect_seapath_distro
    - deploy_prometheus_exporters
    # In the same play as the exporters, so the proxy serves exactly the list
    # that role deployed. Inert until deploy_metrics_proxy_enabled is set in
    # the inventory, which is also what moves the exporters to the loopback.
    - deploy_metrics_proxy
