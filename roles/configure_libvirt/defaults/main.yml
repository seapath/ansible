---
# Allow non-root users in the libvirt group to access the libvirt socket.
# The read/write libvirt socket is root-equivalent, so it is only allowed by
# default when a non-root livemigration_user needs it: live migration over
# qemu+ssh opens the target's local socket as that user.
configure_libvirt_allow_non_root_libvirt_socket_access: "{{ livemigration_user | default('root') != 'root' }}"

# System user that keeps libvirt access when non-root access is disabled:
# libvirt-dbus, which cockpit-machines relies on, runs as libvirtdbus. The
# libvirt sockets are then given this user's primary group, and the polkit
# rule lets it through. Ignored when the user does not exist on the host; set
# it to "" to keep libvirt strictly root-only.
configure_libvirt_socket_trusted_user: libvirtdbus

# Libvirt socket units whose permissions are enforced by the role. libvirtd
# ignores unix_sock_* in libvirtd.conf when socket-activated, and the modular
# daemons (OracleLinux) never read libvirtd.conf, so the restriction is applied
# with systemd drop-ins. Units missing on a host are ignored.
configure_libvirt_socket_units:
  - libvirtd.socket
  - libvirtd-ro.socket
  - virtproxyd.socket
  - virtproxyd-ro.socket
  - virtqemud.socket
  - virtqemud-ro.socket
  - virtsecretd.socket
  - virtsecretd-ro.socket
  - virtstoraged.socket
  - virtstoraged-ro.socket
  - virtnetworkd.socket
  - virtnetworkd-ro.socket
  - virtnodedevd.socket
  - virtnodedevd-ro.socket
  - virtnwfilterd.socket
  - virtnwfilterd-ro.socket
  - virtinterfaced.socket
  - virtinterfaced-ro.socket

# Link speed in Mb/s reported by the guest tap devices, 0 keeps the kernel
# default.
configure_libvirt_tap_link_speed: 0
